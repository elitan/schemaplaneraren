function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=true;
  const t=setTimeout(()=>rej(new Error('timeout')),15000);s.onload=()=>{clearTimeout(t);res();};s.onerror=()=>{clearTimeout(t);rej(new Error('load'));};document.head.appendChild(s);});}
function cellText(p,d){const v=M.row[p][d];if(v<0)return '';const g=awayLabel(p,d);return `${fmtHM(M.sh.V[v].st)}–${fmtHM(M.sh.V[v].en)}${g?' i '+g:''}`;}
const hNum=min=>Math.round(min/60*100)/100;
function buildWorkbook(X){
  const m=M,wb=X.utils.book_new();
  for(let w=0;w<m.WK;w++){
    const aoa=[[`${orgTitle()} · grundschema vecka ${w+1} av ${m.WK}`],[],['Namn','Grupp','Tjänstgöring',...DOWL,'Timmar']];
    m.G.forEach((G,g)=>{const ps=staffIdx(g);if(!ps.length)return;
      ps.forEach(p=>{const x=m.staff[p],row=[x.name,gFull(g),x.pct/100];for(let d=w*7;d<w*7+7;d++)row.push(cellText(p,d));row.push(hNum(A.persons[p].weeks[w]||0));aoa.push(row);});
      aoa.push([]);});
    const ws=X.utils.aoa_to_sheet(aoa);
    for(let r=3;r<aoa.length;r++){const c=ws[X.utils.encode_cell({r,c:2})];if(c&&typeof c.v==='number')c.z='0%';}
    ws['!cols']=[{wch:24},{wch:16},{wch:12},...Array(7).fill({wch:15}),{wch:9}];
    X.utils.book_append_sheet(wb,ws,`Vecka ${w+1}`);}
  const sum=[['Summering för hela perioden'],[],['Namn','Grupp','Tjänstgöring','Timmar','Ska ha','Pass','Kvällar','Lediga dagar','Pass i annan grupp','Ledighet i block']];
  m.G.forEach((G,g)=>staffIdx(g).forEach(p=>{const x=m.staff[p],s=A.persons[p];sum.push([x.name,gFull(g),x.pct/100,hNum(s.mins),hNum(s.target),s.n,s.ev,s.free,s.away,Math.round(s.blockPct*100)/100]);}));
  const ws2=X.utils.aoa_to_sheet(sum);
  for(let r=3;r<sum.length;r++){[2,9].forEach(c=>{const cl=ws2[X.utils.encode_cell({r,c})];if(cl&&typeof cl.v==='number')cl.z='0%';});}
  ws2['!cols']=[{wch:24},{wch:16},{wch:12},{wch:9},{wch:9},{wch:7},{wch:8},{wch:12},{wch:16},{wch:15}];
  X.utils.book_append_sheet(wb,ws2,'Summering');
  const rr=[['Regler och lag'],[],['Krav','Resultat']];A.law.concat(A.rules,A.rec).forEach(r=>rr.push([r.paper,r.val]));
  const ws3=X.utils.aoa_to_sheet(rr);ws3['!cols']=[{wch:60},{wch:60}];X.utils.book_append_sheet(wb,ws3,'Regler');
  return wb;
}
function buildCSV(){
  const q=v=>{const s=String(v??'');return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const lines=[['Namn','Grupp','Tjänstgöring',...M.days.map(dy=>`V${dy.w+1} ${DOW[dy.dow]}`),'Timmar'].map(q).join(';')];
  M.G.forEach((G,g)=>staffIdx(g).forEach(p=>{const x=M.staff[p];const r=[x.name,gFull(g),x.pct+' %'];for(let d=0;d<M.N;d++)r.push(cellText(p,d));r.push(String(hNum(A.persons[p].mins)).replace('.',','));lines.push(r.map(q).join(';'));}));
  return lines.join('\r\n');
}
function saveFile(filename,data,msg){
  const blob=data instanceof Blob?data:new Blob([data]);
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);
  toast(msg||'Filen laddas ner. Öppna den i Excel för att skriva ut.');
}
const orgTitle=()=>S.settings.orgName||'Schemaplaneraren';
const fileSafe=t=>t.replace(/[\\/:*?"<>|]+/g,'').trim()||'Schemaplaneraren';
async function exportExcel(){
  if(busy||!M||!M.P){toast('Lägg in personal och skapa ett schema först.');return;}
  const btn=$('#btnExcel');btn.disabled=true;
  try{
    let X=window.XLSX;
    // Excelbiblioteket ligger i lib/ bredvid sidan och laddas först när det behövs. Utan det blir det en CSV-fil.
    if(!X){try{await loadScript('lib/xlsx.full.min.js');X=window.XLSX;}catch(e){X=null;}}
    const fn=`${fileSafe(orgTitle())} grundschema ${M.WK} veckor`;
    if(X){const out=X.write(buildWorkbook(X),{type:'array',bookType:'xlsx'});
      saveFile(fn+'.xlsx',new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));}
    else saveFile(fn+'.csv',new Blob(['﻿'+buildCSV()],{type:'text/csv;charset=utf-8'}));
  }catch(e){console.error(e);toast('Filen kunde inte skapas. Försök igen.');}
  btn.disabled=false;
}

$('#sheet').addEventListener('input',e=>{if(e.target.id==='pasteArea')updatePastePreview();});
$('#sheet').addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='pasteGroup'&&sheet&&sheet.kind==='paste'){sheet.gid=el.value;updatePastePreview();return;}
  const id=el.dataset.id,k=el.dataset.k;if(!id||!k)return;
  const x=S.staff.find(s=>s.id===id);if(!x)return;
  if(k==='name'){const v=el.value.replace(/\s+/g,' ').trim().slice(0,60);if(!v){el.value=x.name;toast('Namnet kan inte vara tomt.');return;}
    if(v===x.name)return;
    // namnbyte lägger inte om något och ritar inte om tabellen, så markören stannar där den är
    snapshot();x.name=v;el.value=v;S.example=false;persist();renderBanner();renderSchema();$('#btnUndo').disabled=false;
    $('#shName').textContent=v;$('#shAv').textContent=initials(v);return;}
  if(k==='pct')edit(()=>{x.pct=Math.max(5,Math.min(100,Math.round(num(el.value,x.pct))));});
  if(k==='group')edit(()=>{x.group=el.value;x.groups=null;});
  if(k==='wg')edit(()=>{x.wg=WG.includes(el.value)?el.value:'A';});
  if(k==='pref')edit(()=>{x.pref=el.value==='dag'||el.value==='kvall'?el.value:'';});
  if(k==='earliest'||k==='latest'){const raw=el.value.trim();const t=raw?parseTime(raw):null;
    if(raw&&!t){toast('Skriv tiden som till exempel 07:00, eller lämna tomt.');el.value=x[k]||'';return;}
    const e0=k==='earliest'?t:x.earliest,l0=k==='latest'?t:x.latest;
    if(e0&&l0&&hm(l0)<=hm(e0)){toast('Senast slut måste vara efter tidigast start.');el.value=x[k]||'';return;}
    edit(()=>{x[k]=t;});}
  if(k==='maxLen'){const raw=el.value.trim();const v=raw?num(raw,NaN):null;
    if(raw&&(!isFinite(v)||v<1||v>12)){toast('Skriv antal timmar, till exempel 6, eller lämna tomt.');el.value=x.maxLen?String(x.maxLen/60).replace('.',','):'';return;}
    edit(()=>{x.maxLen=v?Math.round(v*4)*15:null;});}
  if(k==='type'){const boxes=[...document.querySelectorAll('#sheet input[data-k="type"]')],on=boxes.filter(b=>b.checked).map(b=>b.dataset.t);
    if(!on.length){el.checked=true;toast('Personen behöver minst en passtyp.');return;}

  if(k==='grp'){const boxes=[...document.querySelectorAll('#sheet input[data-k="grp"]')],on=boxes.filter(b=>b.checked).map(b=>b.dataset.g);
    edit(()=>{x.groups=on.length===boxes.length?null:on;});}
});
$('#tab-regler').addEventListener('click',e=>{

  if(t.closest('#st-fill')){edit(()=>{st.rules.fillWeekend=!st.rules.fillWeekend;});return;}
  if(t.closest('#st-night')){
    // nattpass av: tider som går över midnatt eller börjar före 05 måste bort först, annars försvinner de i tysthet
    if(st.rules.night){const bad=st.types.flatMap(tp=>tp.variants.filter(x=>!okVariant(x[0],x[1],false)).map(x=>`${tp.name} ${x[0]}–${x[1]}`));
      if(bad.length){toast(`Ta först bort nattiderna: ${bad.slice(0,3).join(', ')}${bad.length>3?' …':''}`);return;}}
    edit(()=>{st.rules.night=!st.rules.night;});return;}

  const lend=t.closest('[data-lend]');if(lend){if(lend.dataset.lend!==st.rules.lend)edit(()=>{st.rules.lend=lend.dataset.lend;});return;}
  const ev=t.closest('[data-every]');if(ev){const E=+ev.dataset.every;if(E===st.rules.wkEvery)return;

    toast(`Varje person arbetar ${EVERY[E]} helg. Personalen är fördelad på ${E} helglag och grundschemat är ${S.settings.weeks} veckor.`);return;}
  if(t.closest('#bkSave')){saveBackup();return;}
  if(t.closest('#bkOpen')){openBackup();return;}
  if(t.closest('#rsDemo')){loadState(defaults(),'Demodata är inlagd');return;}
  if(t.closest('#rsAll')){if(!resetArm){resetArm=true;renderRegler();return;}resetAll();return;}
  const bal=t.closest('[data-balance]');if(bal){if(bal.dataset.balance!==st.rules.balance)edit(()=>{st.rules.balance=bal.dataset.balance;});return;}
  const b=t.closest('[data-weeks]');if(b){const w=+b.dataset.weeks;
    if(w!==st.weeks){edit(()=>{st.weeks=w;});toast(`Grundschemat är ${w} veckor. Uppdatera schemat för att lägga om det.`);}return;}
  if(t.closest('#uadd')){const ids=allIds(),uid=nextId('u',ids),gid=nextId('g',ids);
    edit(()=>{st.units.push({id:uid,name:'Ny avdelning',groups:[{id:gid,name:'Grupp 1'}]});st.demand[gid]={weekday:{},weekend:{}};});return;}
  const gadd=t.closest('[data-gadd]');if(gadd){const u=st.units[+gadd.dataset.gadd],gid=nextId('g',allIds());
    edit(()=>{u.groups.push({id:gid,name:'Grupp '+(u.groups.length+1)});st.demand[gid]=clone(st.demand[u.groups[0].id]||{weekday:{},weekend:{}});});return;}
  const urm=t.closest('[data-unrm]');if(urm){const u=st.units[+urm.dataset.unrm],ids=u.groups.map(g=>g.id);
    if(S.staff.some(x=>ids.includes(x.group))){toast(`Flytta eller ta bort personalen i ${u.name} först.`);return;}
    edit(()=>{st.units.splice(+urm.dataset.unrm,1);ids.forEach(g=>delete st.demand[g]);remapCodes(c=>c.g&&ids.includes(c.g)?null:`${c.t}.${c.i}@${c.g||''}`.replace(/@$/,''));});
    toast(`${u.name} är borttagen`,true);return;}
  const grm=t.closest('[data-grm]');if(grm){const [ui,gi]=grm.dataset.grm.split('.').map(Number),u=st.units[ui],g=u.groups[gi],to=u.groups.find(x=>x.id!==g.id);
    const n=S.staff.filter(x=>x.group===g.id).length;
    edit(()=>{S.staff.forEach(x=>{if(x.group===g.id){x.group=to.id;x.groups=null;}});u.groups.splice(gi,1);delete st.demand[g.id];
      remapCodes(c=>c.g===g.id?null:`${c.t}.${c.i}${c.g?'@'+c.g:''}`);});
    toast(`${g.name} är borttagen${n?`. ${n} personer flyttades till ${to.name}`:''}`,true);return;}
  if(t.closest('#tadd')){const id=nextId('t',allIds());
    edit(()=>{st.types.push({id,name:'Nytt pass',color:PALETTE[st.types.length%PALETTE.length],eve:false,variants:[['08:00','16:00']]});});return;}
  const trm=t.closest('[data-trm]');if(trm){const ti=+trm.dataset.trm,tp=st.types[ti];
    edit(()=>{st.types.splice(ti,1);remapCodes(c=>c.t===tp.id?null:`${c.t}.${c.i}${c.g?'@'+c.g:''}`);S.staff.forEach(x=>{if(x.types){x.types=x.types.filter(y=>y!==tp.id);if(!x.types.length)x.types=null;}});});
    toast(`${tp.name} är borttagen`,true);return;}
  const tcol=t.closest('[data-tcol]');if(tcol){const tp=st.types[+tcol.dataset.tcol],i=PALETTE.indexOf(tp.color);
    edit(()=>{tp.color=PALETTE[(i+1)%PALETTE.length];},{stale:false});return;}
  const vadd=t.closest('[data-vadd]');if(vadd){const tp=st.types[+vadd.dataset.vadd],last=tp.variants[tp.variants.length-1];
    if(tp.variants.length>=12){toast('Högst 12 tider per passtyp.');return;}
    edit(()=>{tp.variants.push(last.slice());});return;}
  const vrm=t.closest('[data-vrm]');if(vrm){const [ti,i]=vrm.dataset.vrm.split('.').map(Number),tp=st.types[ti];
    edit(()=>{tp.variants.splice(i,1);remapCodes(c=>c.t!==tp.id?`${c.t}.${c.i}${c.g?'@'+c.g:''}`:c.i===i?null:`${c.t}.${c.i>i?c.i-1:c.i}${c.g?'@'+c.g:''}`);});return;}
});
$('#tab-regler').addEventListener('change',e=>{
  const el=e.target,st=S.settings;
  if(el.id==='st-fullTime'){const v=num(el.value,NaN);if(!isFinite(v)||v<20||v>45){toast('Heltid ska vara mellan 20 och 45 timmar per vecka.');el.value=String(st.fullTime).replace('.',',');return;}
    edit(()=>{st.fullTime=Math.round(v*4)/4;});return;}
  if(el.id==='st-break'){const v=Math.round(num(el.value,NaN));if(!isFinite(v)||v<0||v>60){toast('Skriv rasten i minuter, mellan 0 och 60.');el.value=st.breakMin;return;}
    edit(()=>{st.breakMin=v;});return;}
  if(el.id==='st-org'){const v=el.value.replace(/\s+/g,' ').trim().slice(0,60);if(v===st.orgName)return;edit(()=>{st.orgName=v;},{stale:false});return;}
  if(el.dataset.rule){const k=el.dataset.rule,[lo,hi,step]=RULE_LIMITS[k],raw=num(el.value,NaN),v=Math.round(raw/step)*step;
    if(!isFinite(raw)||v<lo||v>hi){toast(`Skriv ett tal mellan ${fmtH(lo)} och ${fmtH(hi)}.`);el.value=fmtH(st.rules[k]);return;}
    edit(()=>{st.rules[k]=v;});
    if((k==='dailyRest'&&v<LAW_DAILY)||(k==='weeklyRest'&&v<LAW_WEEKLY))toast('Kortare vila än arbetstidslagen kräver stöd i ert kollektivavtal.');return;}
  if(el.dataset.un!==undefined){const u=st.units[+el.dataset.un],v=el.value.replace(/\s+/g,' ').trim().slice(0,30);if(!v){el.value=u.name;return;}
    edit(()=>{u.name=v;},{stale:false});return;}
  if(el.dataset.gn){const [ui,gi]=el.dataset.gn.split('.').map(Number),g=st.units[ui].groups[gi],v=el.value.replace(/\s+/g,' ').trim().slice(0,12);if(!v){el.value=g.name;return;}
    edit(()=>{g.name=v;},{stale:false});return;}
  if(el.dataset.tn!==undefined){const tp=st.types[+el.dataset.tn],v=el.value.replace(/\s+/g,' ').trim().slice(0,20);if(!v){el.value=tp.name;return;}
    edit(()=>{tp.name=v;},{stale:false});return;}
  if(el.dataset.tev!==undefined){const tp=st.types[+el.dataset.tev];edit(()=>{tp.eve=el.checked;});return;}
  if(el.dataset.dm){const [g,wk,tid]=el.dataset.dm.split('.');const v=Math.round(num(el.value,NaN));
    if(!isFinite(v)||v<0||v>20){toast('Skriv ett antal mellan 0 och 20.');el.value=st.demand[g][wk][tid];return;}
    edit(()=>{st.demand[g][wk][tid]=v;});return;}
  if(el.dataset.vt){const [ti,i,j]=el.dataset.vt.split('.').map(Number),tp=st.types[ti],cur=tp.variants[i];const tm=parseTime(el.value);
    if(!tm){toast('Skriv tiden som till exempel 06:45.');el.value=cur[j];return;}
    const nx=cur.slice();nx[j]=tm;
    if(!st.rules.night){
      if(hm(nx[1])<=hm(nx[0])){toast('Passet måste sluta efter att det börjar. Nattpass slås på under Vila och nattarbete.');el.value=cur[j];return;}
      if(hm(nx[0])<300){toast('Utan nattpass får inga pass börja före 05:00. Nattpass slås på under Vila och nattarbete.');el.value=cur[j];return;}}
    else if(!okVariant(nx[0],nx[1],true)){toast('Ett pass kan vara högst 16 timmar.');el.value=cur[j];return;}
    edit(()=>{tp.variants[i]=nx;});}
});
$('#tab-welcome').addEventListener('click',e=>{const t=e.target;
  if(t.closest('#wDemo')){loadState(defaults());return;}
  if(t.closest('#wGuide')){openGuide();return;}
  if(t.closest('#wOpen')){openBackup();return;}
  if(t.closest('#gCancel')){guide=null;if(S.savedAt||S.schedule){welcome='';setTab('schema');}else{welcome='start';renderAll();}return;}
  if(t.closest('#guAdd')){guide.units.push({name:'Avdelning '+(guide.units.length+1),groups:'Grupp 1'});renderWelcome();return;}
  const rm=t.closest('[data-gurm]');if(rm){guide.units.splice(+rm.dataset.gurm,1);renderWelcome();return;}
  if(t.closest('#gCreate'))createFromGuide();});
$('#tab-welcome').addEventListener('input',e=>{const el=e.target;if(!guide)return;
  if(el.id==='gName')guide.name=el.value;
  if(el.dataset.gu!==undefined)guide.units[+el.dataset.gu][el.dataset.f]=el.value;
  if(el.name==='gTpl')guide.template=el.value;
  if(el.id==='gStaff')guide.staff=el.value;
  if(el.id==='gStaff'||el.dataset.f==='groups'){const i=$('#gStaffInfo');if(i)i.textContent=guideStaffInfo();}});
$('#tab-welcome').addEventListener('change',e=>{if(guide&&e.target.name==='gTpl')guide.template=e.target.value;});
$('#scrim').onclick=closeSheet;
document.addEventListener('click',e=>{if(!$('#pop').hidden&&!e.target.closest('#pop'))closePop();
  if(resetArm&&!e.target.closest('#rsAll')){resetArm=false;if(tab==='regler')renderRegler();}
  if(delArm&&!e.target.closest('[data-del]')){delArm=null;const p=sheet&&sheet.kind==='person'?M.staff.findIndex(x=>x.id===sheet.id):-1;if(p>=0)openPerson(p,true);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#pop').hidden)closePop();else closeSheet();}
  if((e.metaKey||e.ctrlKey)&&e.key==='z'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();undo();}});
window.addEventListener('resize',closePop);

/* ---------- start ---------- */
(function start(){
  try{
    if(welcome){tab='welcome';M=buildModel(S);computeAll();A=analyze();renderAll();return;}
    if(S.schedule&&Object.keys(S.schedule).length){refresh();}
    else{M=buildModel(S);computeAll();A=analyze();busy=true;renderAll();busy=false;if(S.staff.length)solveFresh(false);else renderAll();}
  }catch(e){console.error(e);S=defaults();M=buildModel(S);computeAll();A=analyze();renderAll();solveFresh(false);}
})();
</script>
