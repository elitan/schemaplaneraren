<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schemaplaneraren</title>
<meta name="description" content="Lägger grundschema för vård och omsorg. Följer arbetstidslagen, ger alla exakt sina timmar och samlar ledigheten i block. Allt sparas i webbläsaren.">
<style>
/* Neutral profil. Verksamheten väljer namn och färg under Inställningar, och färgen sätts i --accent. Systemtypsnitt, inga
   externa resurser. Bara ljust tema, valt medvetet. Layout: en kolumn, max 1240px. Toppfält med sparstatus, en vy med schemat, personen öppnas genom att klicka på namnet, inställningar bakom kugghjulet. Schema visar en vecka i taget som en tabell, eller hela perioden som rytmremsor. Paneler glider in från höger. */
:root{
  --bg:#eff2ef; --surface:#ffffff; --surface-2:#f4f6f4; --surface-3:#e5eae6;
  --ink:#071013; --ink-2:#454545; --muted:#5d6a64; --faint:#9aa59f;
  --line:#e0e6e1; --line-2:#cdd5cf;
  --accent:#2f5d8a; --accent-tint:#e6edf4;
  --ok:#258735; --ok-tint:#e4f3e7; --bad:#c42b2b; --bad-tint:#fcebeb; --warn:#b45309; --warn-tint:#fdf1e1;
  --btn:var(--accent); --btn-ink:#ffffff;
  --shadow-sm:0 1px 2px rgba(7,16,19,.05); --shadow-lg:0 16px 48px rgba(7,16,19,.16),0 2px 8px rgba(7,16,19,.06); --scrim:rgba(7,16,19,.24);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
.app{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:20px 72px;display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
.small{font-size:12px}

/* toppfält */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand h1{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.bt{display:flex;flex-direction:column}
.bt>span{font-size:12.5px;color:var(--muted)}
.mark{width:40px;height:40px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* Två slags kontroller som inte ska förväxlas:
   - Flikar (.nav, .subnav) byter vad som visas: huvudmenyn, vecka eller hela perioden, en grupp eller alla.
     Text med en linje under den aktiva fliken.
   - Väljare (.seg) sätter ett värde som sparas, till exempel grundschemats längd. Grå ram med en vit knapp. */
.nav{display:flex;gap:4px;border-bottom:1px solid var(--line-2);margin-top:-6px}
.nav button,.subnav button{position:relative;height:40px;padding:0 14px;font-size:14px;font-weight:550;color:var(--muted);border-radius:8px 8px 0 0;white-space:nowrap}
.nav button:hover,.subnav button:hover{color:var(--ink);background:var(--surface-3)}
.nav button[aria-current],.subnav button[aria-current]{color:var(--ink)}
.nav button[aria-current]::after,.subnav button[aria-current]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;border-radius:2px;background:var(--accent)}
.nav button[aria-current]::after{bottom:-1px}
.subnav{display:flex;gap:2px;flex-wrap:wrap}
.subnav button{height:34px;padding:0 12px;font-size:13.5px}
#tabs{align-self:flex-start}
.btn{height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-weight:550;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:var(--shadow-sm);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.primary:hover{opacity:.88}
.btn:disabled{opacity:.4;cursor:default}
.btn.icon{width:34px;padding:0}
.btn.ghost{border-color:transparent;box-shadow:none;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.small{height:28px;padding:0 10px;font-size:12.5px}
svg{flex:none}

.seg{display:inline-flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 16px;border-radius:8px;font-size:13.5px;font-weight:550;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.seg.sm button{height:26px;padding:0 12px;font-size:12.5px}
.frow .seg{flex-wrap:wrap;justify-content:flex-end}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:4px}
.stepper .lab{min-width:120px;text-align:center;font-weight:600;font-size:14px}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--accent-tint);border-radius:12px;padding:12px 16px;font-size:13.5px}
.banner b{font-weight:600}
.wt tr.addrow td{padding:6px 10px 10px;text-align:left;border-bottom:0}
span.addrow,div.addrow{display:flex;gap:4px;flex-wrap:wrap}
.addrow .btn{color:var(--accent);height:28px;font-size:12.5px}
div.addrow{padding:4px 0 8px}
.form select,.form .finput{border:0;background:var(--surface-2);border-radius:6px;padding:6px 8px;font:inherit;min-width:0}
.form .finput{text-align:left;width:min(240px,60%)}
.fhint{font-size:12px;color:var(--muted)}
.btn.del{color:var(--bad)}
.btn.del.armed{background:var(--bad-tint);border-color:transparent}
.frow.wrap{flex-wrap:wrap}
.chks{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:flex-end}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.ued,.ted{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ued .frow,.ted .frow{min-height:46px}
.finput.nm{flex:1 1 140px;width:auto;min-width:0;text-align:left;font-weight:600}
.ued .frow,.ted .frow{flex-wrap:wrap;row-gap:8px}
.gchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px;align-items:center}
.gchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:8px;padding:4px 4px 4px 6px}
.gchip input{width:72px;border:0;background:var(--surface);border-radius:6px;padding:4px 6px;font-weight:550}
.vlist{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px;align-items:center}
.vtime{display:inline-flex;align-items:center;gap:3px;background:var(--surface-2);border-radius:8px;padding:3px 3px 3px 5px;font-size:12px;color:var(--muted)}
.vtime input{width:52px;border:0;background:var(--surface);border-radius:6px;padding:4px 2px;text-align:center;font-variant-numeric:tabular-nums}
.vtime button,.gchip button{color:var(--muted);display:grid;place-items:center;width:22px;height:22px;border-radius:6px;flex:none}
.vtime button:hover,.gchip button:hover{background:var(--surface-3);color:var(--bad)}
.swatch{width:24px;height:24px;border-radius:7px;background:var(--c);flex:none;box-shadow:inset 0 0 0 1px rgba(7,16,19,.12)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.unit{display:inline-flex;align-items:center;gap:6px}
.form .finput.wide{width:min(320px,62%)}

/* välkomstsidan och guiden */
.welcome{display:flex;flex-direction:column;gap:16px;max-width:760px;margin:0 auto;width:100%}
.welcome .hero{padding:24px;gap:14px}
.welcome .hero h2{font-size:22px;letter-spacing:-.02em}
.welcome .lead{font-size:15px;color:var(--ink-2)}
.facts{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--ink-2)}
.wsteps{counter-reset:step}
.wsteps>.card>h2::before{counter-increment:step;content:counter(step);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-tint);color:var(--accent);font-size:12px;margin-right:8px;vertical-align:1px}
.gu{display:grid;grid-template-columns:minmax(120px,1fr) minmax(160px,2fr) auto;gap:8px;align-items:center}
.gu input{border:0;background:var(--surface-2);border-radius:6px;padding:8px 10px;min-width:0}
.tpl{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.tpl:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
.tpl input{accent-color:var(--accent);margin-top:3px}
.tpl small{display:block;color:var(--muted)}
@media (max-width:560px){.gu{grid-template-columns:1fr}.welcome .hero{padding:18px}}
.mini{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.frow .mini input{width:40px;text-align:center}
.tgl{display:flex;align-items:center}
.tgl .toggle.on{background:var(--accent)}
.form.scrollx{overflow-x:auto}
.btn.ghost[aria-pressed="true"]{background:var(--surface-3);color:var(--accent)}
.sethead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sethead h2{font-size:20px;letter-spacing:-.02em}
details.rules{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm)}
details.rules>summary{cursor:pointer;padding:14px 16px;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px}
details.rules>summary::-webkit-details-marker{display:none}
details.rules>summary span{font-weight:400;color:var(--muted);font-size:13px}
details.rules>summary svg{transition:transform .15s;flex:none}
details.rules[open]>summary svg{transform:rotate(180deg)}
details.rules>.cols{padding:0 16px 16px}
details.rules .card{box-shadow:none}

/* status */
.status{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm)}
.shead{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.sicon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.status.ok .sicon{background:var(--ok-tint);color:var(--ok)}
.status.bad .sicon{background:var(--bad-tint);color:var(--bad)}
.status.wait .sicon{background:var(--accent-tint);color:var(--accent)}
.status.busy{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.sicon.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spct{font-size:15px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.strack{height:6px;margin:0 16px 14px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.sbar{height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .2s linear}
#tab-schema.busy #schemaView,#tab-schema.busy .bar{opacity:.4;pointer-events:none;transition:opacity .2s}
.stext{display:flex;flex-direction:column;min-width:0;flex:1}
.stext b{font-size:15px;font-weight:600}
.stext span{font-size:13px;color:var(--muted)}
.smore{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
.smore svg{transition:transform .15s}
.status.open .smore svg{transform:rotate(180deg)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.metric{padding:10px 16px;display:flex;flex-direction:column;gap:1px;min-width:0}
.metric+.metric{border-left:1px solid var(--line)}
.metric b{font-size:17px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metric span{font-size:12px;color:var(--muted)}
.metric b.bad{color:var(--bad)}.metric b.warn{color:var(--warn)}.metric b.ok{color:var(--ok)}
.todo{list-style:none;margin:0;padding:4px 8px 8px;border-top:1px solid var(--line);display:flex;flex-direction:column;max-height:360px;overflow-y:auto}
.todo button{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:7px 8px;border-radius:7px;font-size:13px}
.todo button:hover{background:var(--surface-2)}
.todo .tname{font-weight:600;flex:none}
.todo .what{color:var(--ink-2);flex:1 1 auto;min-width:0}
.todo .when{margin-left:auto;color:var(--muted);flex:none;font-size:12px}
.sev{width:7px;height:7px;border-radius:50%;flex:none;transform:translateY(-1px);display:inline-block}
.sev.hard{background:var(--bad)}.sev.vik{background:var(--warn)}.sev.soft{background:var(--faint)}.sev.ok{background:var(--ok)}

/* veckotabell */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm)}
table.wt{border-collapse:separate;border-spacing:0;width:100%;min-width:780px;font-size:13px}
.wt th,.wt td{padding:3px 3px;border-bottom:1px solid var(--line);text-align:center;font-weight:400}
.wt thead th{font-size:12px;color:var(--muted);font-weight:600;padding:12px 4px 8px;background:var(--surface)}
.wt .nmc{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;min-width:180px;width:200px;padding-left:12px}
.wt .gh th{text-align:left;padding:16px 12px 6px;font-size:12px;color:var(--muted);font-weight:600;position:sticky;left:0;background:var(--surface)}
.wt .gh th span{font-weight:400}
.wt td.we,.wt th.we{background:var(--surface-2)}
.cell{width:100%;min-width:78px;height:36px;border-radius:8px;font-size:11.5px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;font-weight:550;display:flex;align-items:center;justify-content:center;position:relative}
.cell:hover{outline:2px solid var(--ink);outline-offset:-2px}
.cell.off{color:var(--faint);font-weight:400}
.cell{flex-direction:column;line-height:1.15}
.cell small{font-size:10px;font-weight:500;opacity:.8}
.cell.kc{background:var(--c);color:var(--on)}
.cell small.away{font-weight:600;opacity:.9}
.cell.lockd::before{content:"";position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55}
.cell.flag{box-shadow:inset 0 0 0 2px var(--bad)}
.cell.moved{box-shadow:0 0 0 2px var(--accent)}
.wt .hc{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:12.5px;padding-right:14px;text-align:right;white-space:nowrap}
.wt thead .hc{text-align:right}
.wt .cov th,.wt .cov td{font-size:12px;padding-top:6px;padding-bottom:8px}
.wt .cov th{color:var(--muted);font-weight:500}
.okc{color:var(--ok);font-weight:700}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag.bad{color:var(--bad);background:var(--bad-tint)}
.tag.warn{color:var(--warn);background:var(--warn-tint)}
.who{display:flex;align-items:center;gap:10px;text-align:left;min-width:0;width:100%}
.av{width:28px;height:28px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-2);flex:none}
.nmw{min-width:0;display:flex;flex-direction:column}
.who b{font-weight:550;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--muted);font-size:12px}
.who:hover b{text-decoration:underline;text-underline-offset:2px}
.empty{padding:18px 12px!important;color:var(--muted);text-align:left!important}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);padding:12px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* hela perioden */
.people{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden}
.phead,.prow{display:grid;grid-template-columns:200px minmax(0,1fr) 84px;gap:18px;align-items:center;padding:0 16px}
.phead{padding-top:14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.phead .hint{font-size:12px;color:var(--muted)}
.ptitle{padding:14px 16px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.prow{padding-top:6px;padding-bottom:6px}
.prow:hover{background:var(--surface-2)}
.strip{display:grid;gap:8px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wkl{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.wkl .letters{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center;font-size:10px;color:var(--faint)}
.c{aspect-ratio:1/1.15;border-radius:3px;position:relative;max-height:24px}
.c.free{background:var(--surface-3)}
.c.free.we{background:var(--line-2)}
.c:hover{outline:2px solid var(--ink);outline-offset:1px}
.c.flag{box-shadow:0 0 0 2px var(--bad)}
.c.moved{box-shadow:0 0 0 2px var(--accent)}
.pstat{text-align:right;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.pstat .bad{color:var(--bad)}
.kc{background:var(--c)}
.c.awayc::after{content:"";position:absolute;right:2px;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--on);opacity:.8}
.awaytag{font-size:10px;font-weight:600;border-radius:4px;padding:0 4px;background:var(--surface-3);color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}

/* personal */
.notes{padding:12px 16px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
.notes p{display:flex;gap:8px;align-items:baseline}
.stack{display:flex;flex-direction:column;gap:16px}

/* regler */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:15px}
.card .note{font-size:12px;color:var(--muted)}
.rule{display:grid;grid-template-columns:30px 1fr;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .rn{color:var(--faint);font-variant-numeric:tabular-nums;font-size:12.5px}
.rule .rt{font-size:13px;font-weight:550}
.rule .rv{grid-column:2;font-size:12.5px;display:flex;align-items:baseline;gap:6px;color:var(--ink-2)}
.rule .rh{grid-column:2;font-size:12px;color:var(--muted)}
.form{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;min-height:44px;font-size:13px}
.frow+.frow{border-top:1px solid var(--line)}
.frow label,.frow>span:first-child{color:var(--ink-2)}
.frow input{border:0;background:var(--surface-2);border-radius:6px;padding:6px 8px;text-align:right}
.frow input[type=number]{width:76px}
.frow input.time{width:64px;text-align:center}
.frow .times{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.stgrid{display:grid;grid-template-columns:1fr repeat(5,50px);gap:6px;align-items:center;padding:8px 12px;font-size:13px}
.cchart{width:100%;height:auto;display:block;overflow:visible}
.cchart .cg{stroke:var(--line);stroke-width:1}
.cchart .cx,.cchart .cy{font-size:10px;fill:var(--faint);text-anchor:middle}
.cchart .cy{text-anchor:end}
.cchart .ca{fill:var(--accent-tint)}
.cchart .cl{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.cchart .cb{fill:var(--ok-tint);stroke:#a9d6b1;stroke-width:1}
.cchart .cb.bad{fill:var(--bad-tint);stroke:var(--bad)}
.cchart .cn{font-size:12px;font-weight:650;fill:var(--accent);text-anchor:middle}
.cvlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px}
.cvrow{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:13px;flex-wrap:wrap}
.cvrow+.cvrow{border-top:1px solid var(--line)}

<script id="engine">
/* ================= Motor: modell, poäng och optimering =================
   Verksamheten anger en arbetsdag, till exempel 06:45–21:30, och för varje grupp en bemanningskurva för vardag och
   helg: från ett klockslag ska minst så många arbeta, fram till nästa klockslag. Det finns inga passtyper. Motorn
   väljer varje persons pass, start och slut inom arbetsdagen, så att kurvan täcks, alla får exakt sina timmar för
   varje fyraveckorsperiod och arbetstidslagen följs. Grundschemat är cykliskt: sista dagen följs av första.
   Personalen jobbar i sin hemgrupp och lånas till en annan grupp i avdelningen bara när bemanningen kräver det.
   Mellan avdelningar flyttar bara chefen själv. */
const DOW=['mån','tis','ons','tor','fre','lör','sön'];
const DOWL=['Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag','Söndag'];
// Arbetstidslagen: dygnsvila 11 timmar (13 §) och veckovila 36 timmar (14 §). Går inte att ändra.
const DAILY_REST=11,WEEKLY_REST=36;
const MAX_SHIFT=12*60;   // längsta pass
// Rast: pass över fem timmar har 30 minuter (arbetstidslagen 15 §), pass över tio timmar en timme.
function breakFor(gross){return gross>600?60:gross>300?30:0;}
const BLOCK_WEEKS=4;     // timmarna ska stämma för varje fyraveckorsperiod, till exempel 37 × 4 = 148 h för heltid
const WEEK_OPTIONS=[4,8];
// Färger för verksamhetens profil. Den första är standard.
const ACCENTS=[['#2f5d8a','Blå'],['#2e7a5a','Grön'],['#6b4c9a','Lila'],['#a5512c','Rost'],['#3f4a56','Grafit']];
const RULES={maxRow:5,maxWeekDays:6,lend:'behov'};
const LEND_LABEL={aldrig:'Aldrig',behov:'Vid behov',fritt:'Fritt'};
// Passen färgas efter när de slutar: dag före 16, mellan före 19, kväll senare. Kvällarna fördelas rättvist.
const KINDS=[{name:'Dag',color:'#f1a238',hint:'slutar senast 16'},{name:'Mellan',color:'#f8dcae',hint:'slutar senast 19'},{name:'Kväll',color:'#8fb3de',hint:'slutar efter 19'}];
function kindOf(st,en){return en<=16*60?0:en<=19*60?1:2;}
const WG='AB';   // helglag: lag A arbetar helgen i udda veckor, lag B i jämna. Alla arbetar varannan helg.
function wgIndex(x){return x&&x.wg==='B'?1:0;}
/* Helglagen fördelas av systemet, inte av chefen: hälften av varje grupp arbetar udda veckors helger och hälften
   jämna, så att alla arbetar lika många helger och helgerna bemannas lika. Den som har en låst ledig lördag eller
   söndag hamnar i laget som är ledigt den helgen, och den som har ett låst helgpass i laget som arbetar då. Övriga
   behåller sitt lag så länge lagen är lika stora, så att schemat inte ändras i onödan. */
function balanceTeams(staff,locks,weeks){
  const byG={};staff.forEach(x=>(byG[x.group]=byG[x.group]||[]).push(x));
  Object.values(byG).forEach(list=>{const fixed=new Set();
    list.forEach(x=>{const L=locks[x.id]||{};let k=-1;
      Object.keys(L).forEach(d=>{d=+d;if(d>=weeks*7||d%7<5)return;const w=(d/7)|0;k=L[d]==='-'?1-w%2:w%2;});
      if(k>=0){x.wg=WG[k];fixed.add(x);}});
    for(let guard=0;guard<list.length;guard++){const c=[0,1].map(k=>list.filter(x=>wgIndex(x)===k).length),big=c[0]>c[1]?0:1;
      if(Math.abs(c[0]-c[1])<=1)break;
      // den som lades till sist flyttas, så att de som redan har ett lag får behålla det
      const mv=[...list].reverse().find(x=>wgIndex(x)===big&&!fixed.has(x));if(!mv)break;mv.wg=WG[1-big];}});
}
// Bemanningskurva att börja med: [från klockan, minst antal]. Gäller till nästa tid.
const DEFAULT_CURVE={weekday:[['06:45',2],['07:00',4],['12:00',6],['14:00',4],['21:00',2]],
  weekend:[['06:45',2],['07:00',3],['12:00',4],['14:00',3],['21:00',2]]};
/* Vikter i prioritetsordning. Ju högre nivå, desto tyngre väger en avvikelse. Siffrorna är straffpoäng. */
const W={
  // 1. Arbetstidslagen väger tyngst med bred marginal. Under huvudsökningen kostar ett brott mindre (lawSearch), så att
  //    sökningen kan passera genom ett brott och reparera det. Före slutfasen gäller full vikt (strictLaw).
  rest:20000,weekRest:20000,lawSearch:2500,
  // 2. Bemanning: per person och timme som kurvan inte täcks. Helgtimmar som saknas går till vikarie och väger lättare.
  shortWd:220,shortWe:90,
  //    Personal utöver kurvan kostar i kvadrat, så att den sprids jämnt över veckans dagar och inte samlas en dag.
  //    Efter 15 kostar den dubbelt, så att extra personal hamnar på dagen.
  surplus:15,surplusLate:2,
  // 3. Exakta timmar, per timme fel och fyraveckorsperiod. Mer än ett pass övertid blir dyrare än en lucka i kurvan.
  hUnder:400,hOver:120,otTol:480,hOverHard:500,
  // 4. Helger: en arbetshelg utan pass, ett pass under en ledig helg, olika slags pass lördag och söndag.
  wkMiss:600,wkWrong:600,wkMix:6,
  // 5. Återhämtning: långa veckor, långa arbetsperioder, ensamma lediga dagar, vila runt ledigheten, jämna veckor.
  sixWeek:150,sixSoft:15,sixRoll:30,longRun:160,run7:800,singleOff:150,block:10,isolated:8,switch:3,edge:4,edgeWk:16,weekVar:.3,weekOver:25,maxWeekPct:20,
  // 6. Övrigt: hemgruppen, rättvis fördelning av kvällar (fair, per kvällspass i kvadrat från snittet), få pass och få flyttar vid ändring.
  away:200,fair:60,shift:10,stab:12};

function pad(n){return String(n).padStart(2,'0')}
function hm(s){const a=String(s||'0:0').split(':').map(Number);return (a[0]||0)*60+(a[1]||0)}
function fmtHM(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function fmtShort(m){return pad(Math.floor(m/60))+(m%60?':'+pad(m%60):'')}
function fmtDur(m){m=Math.round(m);const s=m<0?'−':'';m=Math.abs(m);return s+Math.floor(m/60)+(m%60?':'+pad(m%60):'')}
function h1(min){return (min/60).toFixed(1).replace('.',',')}
function fmtH(h){return String(h).replace('.',',')}
// Ett pass sparas som "0645-1530@g1": start, slut och grupp. Gruppen kan saknas i äldre låsningar.
function codeOf(st,en){return pad(Math.floor(st/60))+pad(st%60)+'-'+pad(Math.floor(en/60))+pad(en%60);}
function parseCode(c){const m=/^(\d{2})(\d{2})-(\d{2})(\d{2})(?:@([a-z][a-z0-9]{0,15}))?$/.exec(String(c||''));if(!m)return null;
  const st=+m[1]*60+ +m[2],en=+m[3]*60+ +m[4];if(+m[2]>59||+m[4]>59||en>1440||en<=st||en-st>MAX_SHIFT)return null;
  return {st,en,g:m[5]||null,k:codeOf(st,en)};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// Tål "75%", "37,5", " 80 " och liknande från inmatning eller Excel.
function num(v,def){if(typeof v==='number'&&isFinite(v))return v;const s=String(v??'').replace(/[%\s ]/g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:def;}
// Tål "6.45", "06,45", "645", "6:45" och "14". Returnerar "HH:MM" eller null. "24:00" tillåts som slut.
function parseTime(v){const s=String(v??'').trim().replace(/[.,]/g,':');let m=s.match(/^(\d{1,2}):(\d{2})$/)||s.match(/^(\d{1,2})(\d{2})$/);
  if(!m){const h=s.match(/^(\d{1,2})$/);if(h)m=[0,h[1],'00'];}
  if(!m)return null;const h=+m[1],mi=+m[2];if(h===24&&mi===0)return '24:00';if(h>23||mi>59)return null;return pad(h)+':'+pad(mi);}
// Textfärg som syns mot passfärgen.
function onColor(hex){const n=parseInt(String(hex).slice(1),16);if(!isFinite(n))return '#071013';const r=n>>16&255,g=n>>8&255,b=n&255;
  return (0.299*r+0.587*g+0.114*b)>150?'#071013':'#ffffff';}
const cleanId=v=>String(v??'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,16);
const cp=o=>JSON.parse(JSON.stringify(o));
// Antal som kurvan kräver vid en tidpunkt: värdet från den senaste tiden som inte är senare.
function curveAt(curve,m){let n=0;for(const [t,c] of curve){if(hm(t)<=m)n=c;else break;}return n;}

// Ett tomt upplägg: verksamhetens namn och avdelningar med grupper. Ingen personal.
function blank(orgName,units){
  const curves={};units.forEach(u=>u.groups.forEach(g=>curves[g.id]=cp(DEFAULT_CURVE)));
  return {v:8,example:false,stale:false,savedAt:null,
    settings:{orgName:orgName||'',accent:ACCENTS[0][0],weeks:4,fullTime:37,day:{start:'06:45',end:'21:30'},shift:{min:360,max:570},
      units:cp(units),curves,rules:Object.assign({},RULES),iterations:3000000},
    staff:[],locks:{},schedule:null};
}

}
function baseFrom(rows){const m=M,b=new Int32Array(Math.max(1,m.P*m.N)).fill(-1);if(!rows)return b;
  for(let p=0;p<m.P;p++){const r=rows[m.staff[p].id];if(!r)continue;for(let d=0;d<m.N;d++){const pc=parseCode(r[d]);const v=pc?m.sh.codeIdx[pc.k]:undefined;
    if(v!==undefined){const g=pc.g&&m.gIdx[pc.g]!==undefined?m.gIdx[pc.g]:m.home[p];b[p*m.N+d]=(v+1)*64+g;}}}
  return b;}
function extract(){const rows={};const m=M;
  for(let p=0;p<m.P;p++){const o={};for(let d=0;d<m.N;d++){const v=m.row[p][d];if(v<0)continue;o[d]=m.sh.V[v].code+'@'+m.G[m.grp[p*m.N+d]].id;}rows[m.staff[p].id]=o;}
  return rows;}

function I(sev,d,text,extra){return Object.assign({sev,d,text},extra||{})}

/* ---------- Regler ----------
   pScore ger straffpoäng för en persons rad, lägre är bättre. Den räknar först ihop raden en gång (tally) och
   summerar sedan reglerna nedan, i prioritetsordning. Varje regel lägger till poäng och skriver, när out finns,
   en förklaring i klartext. Bemanningen räknas utanför personen, per dag och grupp (covPen). */
function pScore(p,out){
  const c=M.ctx;tally(p,c);
  const pen=lawDailyRest(p,c,out)+lawWeeklyRest(p,c,out)+hours(p,c,out)+weekends(p,c,out)+workDays(p,c,out)
    +restAroundOff(p,c,out)+evenWeeks(p,c,out)+fairness(p,c,out)+other(p,c,out);
  if(out)out.stats={n:c.n,ev:c.ev,we:c.we,day:c.day,mins:c.mins,away:c.away,minGap:c.minGap,minWeek:c.minWeek,maxWeek:c.maxWeek,
    maxRun:c.maxRun,singles:c.singles,blocks:c.blocks,freeInBlocks:c.freeInBlocks,free:M.N-c.n,wkMissing:c.wkMissing,sixWeeks:c.sixWeeks,
    edges:c.edges,edgeRest:c.edgeRest,wkRestMin:c.wkRestMin,wkRestSum:c.wkRestSum,wkRestN:c.wkRestN,weeks:Array.from(c.wk),blocks4:Array.from(c.bm)};
  return pen;
}
// En genomgång av raden: antal pass, kvällar, timmar per vecka och period, dagar per vecka och pass utanför hemgruppen.
function tally(p,c){
  const m=M,N=m.N,row=m.row[p],sh=m.sh,b=p*N,hg=m.home[p];
  c.wk.fill(0);c.wc.fill(0);c.bm.fill(0);c.n=0;c.ev=0;c.we=0;c.day=0;c.mins=0;c.away=0;
  for(let d=0;d<N;d++){const v=row[d];if(v<0)continue;const w=(d/7)|0;
    c.n++;c.mins+=sh.net[v];c.wk[w]+=sh.net[v];c.wc[w]++;c.bm[(w/BLOCK_WEEKS)|0]+=sh.net[v];
    if(sh.eve[v])c.ev++;else c.day++;if(m.days[d].we)c.we++;
    if(m.grp[b+d]!==hg)c.away++;}
}
// 1. Dygnsvila, arbetstidslagen 13 §: minst 11 timmar mellan två pass, även när grundschemat börjar om.
function lawDailyRest(p,c,out){
  const m=M,N=m.N,row=m.row[p],sh=m.sh,w=m.w;let pen=0;c.minGap=1e9;
  for(let d=0;d<N;d++){const v=row[d];if(v<0)continue;const pv=row[(d+N-1)%N];if(pv<0)continue;
    const gap=1440+sh.st[v]-sh.en[pv];if(gap<c.minGap)c.minGap=gap;
    if(gap<m.dailyRest){pen+=w.rest;out&&out.push(I('hard',d,`För kort dygnsvila, ${h1(gap)} h (minst ${DAILY_REST} h)`));}}
  return pen;
}
// 1. Veckovila, arbetstidslagen 14 §: längsta sammanhängande vila INOM varje kalendervecka, måndag 00 till söndag 24.
//    Vila som sträcker sig över veckoskiftet räknas bara med den del som ligger i veckan.
function lawWeeklyRest(p,c,out){
  const m=M,N=m.N,WK=m.WK,row=m.row[p],sh=m.sh,w=m.w,best=m.tmp;best.fill(0);let first=-1,prevEnd=0,pen=0;
  const gapRec=(a,bb)=>{const w0=Math.floor(a/10080),w1=Math.floor((bb-1)/10080);
    for(let k=w0;k<=w1;k++){const ws=k*10080,len=Math.min(bb,ws+10080)-Math.max(a,ws),ww=((k%WK)+WK)%WK;if(len>best[ww])best[ww]=len;}};
  for(let d=0;d<N;d++){const v=row[d];if(v<0)continue;const s=d*1440+sh.st[v];if(first<0)first=s;else gapRec(prevEnd,s);prevEnd=d*1440+sh.en[v];}
  if(first>=0)gapRec(prevEnd,first+N*1440);else best.fill(10080);
  c.minWeek=1e9;
  for(let k=0;k<WK;k++){if(best[k]<c.minWeek)c.minWeek=best[k];
    if(best[k]<m.weeklyRest){pen+=w.weekRest;out&&out.push(I('hard',k*7,`För kort veckovila vecka ${k+1}, ${h1(best[k])} h (minst ${WEEKLY_REST} h)`,{w:k}));}}
  return pen;
}
// 3. Exakta timmar för varje fyraveckorsperiod.
function hours(p,c,out){
  const m=M,w=m.w,tg=m.blockT[p];let pen=0;
  for(let b=0;b<m.NB;b++){const dev=c.bm[b]-tg;
    if(dev>w.otTol)pen+=w.hOverHard*(dev-w.otTol)/60;
    if(dev!==0){pen+=(dev>0?w.hOver:w.hUnder)*Math.abs(dev)/60;
      if(out&&Math.abs(dev)>=15)out.push(I('soft',-1,`${m.NB>1?`Vecka ${b*4+1}–${b*4+4}: h`:'H'}ar ${fmtDur(c.bm[b])} h, ska ha ${fmtDur(tg)} h`));}}
  return pen;
}
// 4. Varannan helg: arbetshelgen har pass både lördag och söndag, den lediga helgen är helt ledig.
function weekends(p,c,out){
  const m=M,N=m.N,WK=m.WK,row=m.row[p],sh=m.sh,w=m.w,b=p*N;let pen=0;
  c.wkMissing=0;c.wkRestMin=1e9;c.wkRestSum=0;c.wkRestN=0;
  for(let k=0;k<WK;k++){const sa=k*7+5,su=sa+1;
    if(m.wkWork[p*WK+k]){let miss=0;
      if(row[sa]<0&&m.lock[b+sa]!==-1)miss++;
      if(row[su]<0&&m.lock[b+su]!==-1)miss++;
      if(miss){pen+=w.wkMiss*miss;c.wkMissing+=miss;out&&out.push(I('soft',sa,`Arbetshelg vecka ${k+1} saknar pass ${miss} dag${miss>1?'ar':''}`));}
      if(row[sa]>=0&&row[su]>=0&&sh.eve[row[sa]]!==sh.eve[row[su]])pen+=w.wkMix;}
    else{
      if(row[sa]>=0||row[su]>=0){pen+=w.wkWrong;out&&out.push(I('hard',row[sa]>=0?sa:su,`Har pass under sin lediga helg vecka ${k+1}`));}
      // vilan under den lediga helgen räknas bara för visning
      if(out&&row[sa]<0&&row[su]<0){let bd=sa-1,ad=su+1,j=0;while(row[(bd+N)%N]<0&&j++<N)bd--;j=0;while(row[ad%N]<0&&j++<N)ad++;
        const bv=row[(bd+N)%N],av2=row[ad%N];if(bv>=0&&av2>=0){const r=(ad*1440+sh.st[av2])-(bd*1440+sh.en[bv]);if(r<c.wkRestMin)c.wkRestMin=r;c.wkRestSum+=r;c.wkRestN++;}}}}
  return pen;
}
// 5. Arbetsdagar: högst maxWD av sju, högst maxRow i rad (sju i rad undviks starkt), ledighet i block om minst två dagar,
//    inga ensamma arbetsdagar. Långa veckor som timmarna gör oundvikliga kostar inget.
function workDays(p,c,out){
  const m=M,N=m.N,WK=m.WK,row=m.row[p],sh=m.sh,w=m.w;let pen=0;
  c.sixWeeks=0;let sixExtra=0;
  const mx=m.maxWD;
  for(let k=0;k<WK;k++)if(c.wc[k]>mx){c.sixWeeks++;sixExtra+=c.wc[k]-mx;out&&out.push(I('soft',k*7,`Arbetar ${c.wc[k]} dagar vecka ${k+1}`,{w:k}));}
  // fler än fem dagar i en vecka är tillåtet upp till gränsen men undviks
  for(let k=0;k<WK;k++)if(c.wc[k]>5)pen+=w.sixSoft*(c.wc[k]-5);
  const allow=m.sixAllow[p];
  pen+=w.sixWeek*Math.max(0,sixExtra-allow);
  if(c.n>mx&&N>=7){let cnt=0,roll=0;for(let d=0;d<7;d++)if(row[d]>=0)cnt++;
    for(let d=0;d<N;d++){if(cnt>mx)roll+=cnt-mx;if(row[d]>=0)cnt--;if(row[(d+7)%N]>=0)cnt++;}
    pen+=w.sixRoll*Math.max(0,roll-3*allow);}
  for(let d=0;d<N;d++){const v=row[d];if(v<0)continue;const pv=row[(d+N-1)%N];
    if(pv>=0){if(!sh.eve[pv]&&sh.eve[v])pen+=w.switch;}
    else if(row[(d+1)%N]<0)pen+=w.isolated;}
  // arbetsblock och ledighetsblock (cykliskt), med start på en dag som inleder en ledighet
  let f=-1;for(let d=0;d<N;d++){if(row[d]<0&&row[(d+N-1)%N]>=0){f=d;break;}}
  c.singles=0;c.blocks=0;c.freeInBlocks=0;c.maxRun=0;
  const runEnd=(run,d)=>{c.blocks++;if(run>c.maxRun)c.maxRun=run;
    if(run>m.maxRow){pen+=w.longRun*(run-m.maxRow)+w.run7*Math.max(0,run-m.maxRow-1);out&&out.push(I('soft',d,`Arbetar ${run} dagar i rad (högst ${m.maxRow})`));}};
  const freeEnd=free=>{if(free===1){c.singles++;pen+=w.singleOff;}else c.freeInBlocks+=free;};
  if(f<0){if(c.n===N&&N>0)runEnd(N,N-1);}
  else{let run=0,free=0;
    for(let k=0;k<N;k++){const d=(f+k)%N;
      if(row[d]<0){if(run>0){runEnd(run,(d+N-1)%N);run=0;}free++;}
      else{if(free>0){freeEnd(free);free=0;}run++;}}
    if(run>0)runEnd(run,(f+N-1)%N);
    if(free>0)freeEnd(free);}
  pen+=w.block*c.blocks;
  return pen;
}
// 5. Vila runt ledigheten: ju tidigare sista passet före en ledighet slutar och ju senare första passet efter börjar,
//    desto fler timmar blir ledigheten. Kanterna runt en ledig helg väger tyngst, så att den som är ledig i helgen
//    helst inte jobbar kväll på fredagen.
function restAroundOff(p,c,out){
  const m=M,N=m.N,WK=m.WK,row=m.row[p],sh=m.sh,w=m.w;let pen=0;c.edges=0;c.edgeRest=0;
  for(let d=0;d<N;d++){const v=row[d];if(v<0)continue;
    if(row[(d+1)%N]<0){c.edges++;c.edgeRest+=1440-sh.en[v];let wt=w.edge;
      if(d%7===4&&row[(d+2)%N]<0&&!m.wkWork[p*WK+(((d/7)|0)%WK)])wt+=w.edgeWk;pen+=wt*(sh.en[v]-m.minEnd)/60;}
    if(row[(d+N-1)%N]<0){c.edges++;c.edgeRest+=sh.st[v];let wt=w.edge;const pw=(((d/7)|0)+WK-1)%WK;
      if(d%7===0&&row[(d+N-2)%N]<0&&!m.wkWork[p*WK+pw])wt+=w.edgeWk;pen+=wt*(m.maxStart-sh.st[v])/60;}}
  return pen;
}
// 5. Jämna veckor: timmarna sprids över perioden, ingen vecka mycket över snittet.
function evenWeeks(p,c,out){
  const m=M,WK=m.WK,w=m.w,wt=m.targetMin[p]/WK,cap=m.wkCap[p];let pen=0;c.maxWeek=0;
  for(let k=0;k<WK;k++){const x=(c.wk[k]-wt)/60;pen+=w.weekVar*x*x;if(c.wk[k]>c.maxWeek)c.maxWeek=c.wk[k];
    if(c.wk[k]>cap+1){pen+=w.weekOver*(c.wk[k]-cap)/60;out&&out.push(I('soft',-1,`Vecka ${k+1} har ${fmtDur(c.wk[k])} h, högst ${fmtDur(Math.floor(cap/15)*15)} h`,{w:k}));}}
  return pen;
}
// 6. Rättvis fördelning: varje person tar sin andel av kvällarna, lika stor som snittet i avdelningen.
function fairness(p,c,out){const m=M,dE=c.ev-m.shareE[p]*c.n;return m.w.fair*dE*dE;}
// Kvällarnas andel i varje avdelning som schemat ser ut nu, bland dem som kan ta kvällspass.
function retarget(){const m=M,ev=new Float64Array(m.U.length),n=new Float64Array(m.U.length);
  for(let p=0;p<m.P;p++){if(!m.shareE[p])continue;const row=m.row[p];for(let d=0;d<m.N;d++){const v=row[d];if(v<0)continue;n[m.unit[p]]++;if(m.sh.eve[v])ev[m.unit[p]]++;}}
  for(let p=0;p<m.P;p++){const u=m.unit[p];if(m.shareE[p]&&n[u])m.shareE[p]=Math.max(.05,Math.min(.95,ev[u]/n[u]));}}
// 6. Övrigt: hemgruppen, antal pass och, när ett schema anpassas, så få flyttar som möjligt.
function other(p,c,out){
  const m=M,N=m.N,row=m.row[p],w=m.w,b=p*N;let pen=w.away*c.away+w.shift*c.n;
  if(m.base){for(let d=0;d<N;d++){const v=row[d],key=v<0?-1:(v+1)*64+m.grp[b+d];if(key!==m.base[b+d])pen+=m.stabW;}}
  return pen;
}
// Full vikt för arbetstidslagen inför slutfasen. Poängen räknas om eftersom vikten ändras.
function strictLaw(){const m=M;m.w.rest=m.w.weekRest=m.w.lawFull;retarget();computeAll();}
function computeAll(){const m=M;m.total=0;for(let p=0;p<m.P;p++){m.pen[p]=pScore(p);m.total+=m.pen[p];}
  for(let k=0;k<m.N*m.nG;k++){m.covP[k]=covPen(k);m.total+=m.covP[k];}}

/* ---------- Första schemat ----------
   Dag för dag och grupp för grupp läggs det pass som täcker mest av det som saknas i kurvan, hos den person
   där det kostar minst. Helgerna först, eftersom bara halva personalen kan ta dem. Sedan fylls timmarna. */
function greedyFill(){
  const m=M,N=m.N,K=m.K,sh=m.sh,gain=new Float64Array(m.nV);
  const order=[...Array(N).keys()].sort((a,b)=>(m.days[b].we-m.days[a].we)||(RNG()-.5));
  for(const d of order)for(let g=0;g<m.nG;g++){const b=(d*m.nG+g)*K;
    for(let guard=0;guard<60;guard++){
      let any=false;for(let k=0;k<K;k++)if(m.cnt[b+k]<m.need[b+k]){any=true;break;}if(!any)break;
      for(let v=0;v<sh.nReg;v++){let s=0;for(let k=sh.kA[v];k<sh.kB[v];k++)if(m.cnt[b+k]<m.need[b+k])s+=sh.kLen[k];gain[v]=s;}
      let best=0,bp=-1,bv=-1;
      for(const q of m.inG[g]){const i=q*N+d;if(!m.canW[i]||m.row[q][d]>=0)continue;
        let vv=-1;for(const v of m.av[q])if(vv<0||gain[v]>gain[vv]||(gain[v]===gain[vv]&&sh.net[v]>sh.net[vv]))vv=v;
        if(vv<0||!gain[vv])continue;
        txBegin();txSet(q,d,vv,g);const dl=txProbe()+RNG()*.5;if(dl<best){best=dl;bp=q;bv=vv;}}
      if(bp<0)break;
      txBegin();txSet(bp,d,bv,g);txApply();}}
  fillHours();
}
// Den som har för få timmar får fler pass, på den dag och tid där det kostar minst.
function fillHours(){
  const m=M,N=m.N,order=[...Array(m.P).keys()].sort(()=>RNG()-.5);
  for(const p of order){
    for(let guard=0;guard<N&&hoursDev(p)<-60;guard++){let best=-1e-9,bd=-1,bv=-1,bg=-1;
      for(let d=0;d<N;d++){if(!m.canW[p*N+d]||m.row[p][d]>=0)continue;
        const L=m.av[p],tries=[bestGapV(p,d,m.home[p])];for(let k=0;k<3;k++)tries.push(L[(RNG()*L.length)|0]);
        for(const v of tries){if(v<0)continue;txBegin();txSet(p,d,v,m.home[p]);const dl=txProbe();if(dl<best){best=dl;bd=d;bv=v;bg=m.home[p];}}}
      if(bd<0)break;
      txBegin();txSet(p,bd,bv,bg);txApply();}}
}
// Det tillåtna pass som täcker mest av det som saknas i gruppen den dagen.
function bestGapV(p,d,g){const m=M,sh=m.sh,b=(d*m.nG+g)*m.K;let best=-1,bs=-1;
  for(const v of m.av[p]){let s=0;for(let k=sh.kA[v];k<sh.kB[v];k++){const x=m.need[b+k]-m.cnt[b+k];s+=(x>0?x*4:x<0?x:0)*sh.kLen[k];}if(s>bs){bs=s;best=v;}}
  return best;}
function hoursDev(p){const m=M;let t=0;for(let d=0;d<m.N;d++){const v=m.row[p][d];if(v>=0)t+=m.sh.net[v];}return t-m.targetMin[p];}

/* ---------- Sökningen ----------
   Ett slumpat drag i taget: flytta passets start eller slut, lägg till eller ta bort ett pass, flytta ett pass till
   en annan dag, ge ett pass till en kollega (och ta ett av kollegans pass en annan dag), byt pass med en kollega samma dag
   eller låna ut till en annan grupp. Draget behålls om det blir bättre, eller ibland ändå medan temperaturen är hög. */
function trySwap(T){
  const m=M,N=m.N,P=m.P;if(!P)return;
  // med jämna mellanrum flyttas målet för kvällarna till avdelningens faktiska snitt, så att rättvisan bara jämnar ut mellan personer
  if(++m.it%50000===0){retarget();computeAll();}
  const p=(RNG()*P)|0,d=(RNG()*N)|0,i=p*N+d;if(!m.canW[i])return;
  const v=m.row[p][d],g=m.grp[i],r=RNG();txBegin();
  if(v<0){   // ledig dag: lägg ett pass, oftast där det saknas folk
    let ng=m.home[p];if(m.rules.lend!=='aldrig'&&RNG()<.15){const L=m.inG.map((x,gi)=>gi).filter(gi=>m.allowG[p*m.nG+gi]);ng=L[(RNG()*L.length)|0];}
    const nv=RNG()<.6?bestGapV(p,d,ng):m.av[p][(RNG()*m.av[p].length)|0];if(nv>=0)txSet(p,d,nv,ng);
  }else if(r<.33){const nb=m.sh.nb[v];if(!nb.length)return;const nv=nb[(RNG()*nb.length)|0];if(!m.allowV[p*m.nV+nv])return;txSet(p,d,nv,g);}
  else if(r<.40){const L=m.av[p];txSet(p,d,L[(RNG()*L.length)|0],g);}
  else if(r<.52){txSet(p,d,-1,-1);}
  else if(r<.68){const d2=(RNG()*N)|0;if(d2===d||!m.canW[p*N+d2]||m.row[p][d2]>=0)return;txSet(p,d,-1,-1);txSet(p,d2,v,g);}
  else if(r<.88){const L=m.inG[g],q=L[(RNG()*L.length)|0];if(q===p||!m.canW[q*N+d]||m.row[q][d]>=0)return;
    const vq=fitV(q,v);if(vq<0)return;txSet(p,d,-1,-1);txSet(q,d,vq,g);
    // ofta tar p ett av q:s pass en annan dag, så att timmarna står nästan still för båda
    if(RNG()<.6){const off=(RNG()*N)|0;for(let k=0;k<N;k++){const d2=(off+k)%N;if(d2===d)continue;const u=m.row[q][d2],g2=m.grp[q*N+d2];
      if(u<0||!m.canW[q*N+d2]||!m.canW[p*N+d2]||m.row[p][d2]>=0||!m.allowG[p*m.nG+g2])continue;const vp=fitV(p,u);if(vp<0)continue;
      txSet(q,d2,-1,-1);txSet(p,d2,vp,g2);break;}}}
  else if(r<.96){const L=m.inG[g],q=L[(RNG()*L.length)|0];if(q===p||!m.canW[q*N+d])return;const u=m.row[q][d],g2=m.grp[q*N+d];if(u<0)return;
    if(!m.allowG[q*m.nG+g]||!m.allowG[p*m.nG+g2]||!m.allowV[p*m.nV+u]||!m.allowV[q*m.nV+v])return;txSet(p,d,u,g2);txSet(q,d,v,g);}
  else{if(m.rules.lend==='aldrig')return;const L=[];for(let gi=0;gi<m.nG;gi++)if(gi!==g&&m.allowG[p*m.nG+gi])L.push(gi);if(!L.length)return;txSet(p,d,v,L[(RNG()*L.length)|0]);}
  txTry(T);
}

/* ---------- Finslipning efter sökningen ----------
   Varje pass provar närliggande start- och sluttider och behåller varje förbättring. Sedan tas pass som bryter
   mot vilan bort, och den som då får för få timmar får nya pass. */
function finish(){
  const m=M;
  for(let round=0;round<3;round++){let any=false;for(let p=0;p<m.P;p++)if(polish(p))any=true;if(!any)break;}
  repairRest();
}
function polish(p){const m=M,N=m.N;let improved=false;
  for(let d=0;d<N;d++){const i=p*N+d,v=m.row[p][d];if(v<0||!m.canW[i])continue;const g=m.grp[i];
    let best=-1e-9,bv=-1;
    for(const nv of m.sh.nb[v]){if(!m.allowV[p*m.nV+nv])continue;txBegin();txSet(p,d,nv,g);const dl=txProbe();if(dl<best){best=dl;bv=nv;}}
    if(bv>=0){txBegin();txSet(p,d,bv,g);txApply();improved=true;}}
  return improved;}
/* Sista kontroll: ett vilobrott som sökningen inte hann reparera tas bort. Passet som kostar minst att ta bort
   lämnas tomt, så att inget brott mot vilan finns kvar. Låsta pass rörs inte. */
function hasRestBreach(p){const out=[];pScore(p,out);return out.some(i=>i.sev==='hard'&&i.text.startsWith('För kort'));}
function repairRest(){
  const m=M;let changed=false;
  for(let p=0;p<m.P;p++){
    for(let guard=0;guard<m.N&&hasRestBreach(p);guard++){let best=Infinity,bd=-1;
      for(let d=0;d<m.N;d++){if(m.row[p][d]<0||!m.canW[p*m.N+d])continue;txBegin();txSet(p,d,-1,-1);const dl=txProbe();if(dl<best){best=dl;bd=d;}}
      if(bd<0||best>=0)break;
      txBegin();txSet(p,bd,-1,-1);txApply();changed=true;}}
  if(changed){fillHours();for(let p=0;p<m.P;p++)polish(p);computeAll();}
}

/* Sammanställning för visning */
function analyze(){
  const m=M,N=m.N,P=m.P,r=m.rules,st=m.S.settings,sh=m.sh,K=m.K;
  const persons=[],flags=new Uint8Array(Math.max(1,P*N));let hard=0,soft=0,dailyV=0,weeklyV=0;
  const saved=m.base;m.base=null;
  for(let p=0;p<P;p++){const out=[];pScore(p,out);const s=out.stats;
    let h=0;out.forEach(i=>{if(i.sev==='hard'){h++;if(i.text.startsWith('För kort dygnsvila'))dailyV++;if(i.text.includes('veckovila'))weeklyV++;
      if(i.d>=0&&i.w===undefined)flags[p*N+i.d]=2;}});
    hard+=h;soft+=out.length-h;
    persons.push(Object.assign({target:m.targetMin[p],blockTarget:m.blockT[p],issues:out,hard:h,soft:out.length-h,
      hoursOk:s.blocks4.every(x=>Math.abs(x-m.blockT[p])<15),blockPct:s.free?s.freeInBlocks/s.free:1,weekRatio:m.targetMin[p]?s.maxWeek/(m.targetMin[p]/m.WK):1},s));}
  m.base=saved;
  // Bemanningen: för varje dag och grupp, största antal som saknas och timmar under kurvan, och de tider som inte täcks.
  const missG=m.G.map(()=>new Int16Array(N)),gapH=m.G.map(()=>new Float64Array(N)),gaps=[];
  let shortWd=0,shortWe=0,needWd=0,needWe=0;
  for(let d=0;d<N;d++)for(let g=0;g<m.nG;g++){const b=(d*m.nG+g)*K,we=m.days[d].we;let mx=0,mins=0,k0=-1,kmax=0;
    for(let k=0;k<=K;k++){const x=k<K?m.need[b+k]-m.cnt[b+k]:0;
      if(k<K){const nm=m.need[b+k]*sh.kLen[k];if(we)needWe+=nm;else needWd+=nm;}
      if(x>0){if(k0<0){k0=k;kmax=0;}kmax=Math.max(kmax,x);mins+=x*sh.kLen[k];if(x>mx)mx=x;}
      else if(k0>=0){gaps.push({d,g,from:sh.TP[k0],to:sh.TP[k],n:kmax});k0=-1;}}
    missG[g][d]=mx;gapH[g][d]=mins/60;if(we)shortWe+=mins;else shortWd+=mins;}
  // Hur jämnt bemanningen är fördelad över vardagarna: vid samma tid i samma grupp, största skillnaden mellan två vardagar.
  let daySpread=0;
  for(let g=0;g<m.nG;g++)for(let k=0;k<K;k++){let mn=1e9,mx=-1;for(let d=0;d<N;d++){if(m.days[d].we)continue;const c=m.cnt[(d*m.nG+g)*K+k];if(c<mn)mn=c;if(c>mx)mx=c;}if(mx>=0&&mx-mn>daySpread)daySpread=mx-mn;}
  const gName=g=>`${m.U[m.G[g].unit].name} ${m.G[g].name}`;
  // Listan "att titta på" visar bara det chefen behöver göra något åt: lagbrott, luckor på vardagar
  // och den som inte får sina timmar. Övriga avvikelser per person syns på personens egen sida.
  const todo=[];
  persons.forEach((x,p)=>{
    x.issues.filter(i=>i.sev==='hard').forEach(i=>todo.push({sev:'hard',p,d:i.w!==undefined?-1:i.d,text:i.text}));
    if(!x.hoursOk){const i=x.issues.find(i=>/ska ha /.test(i.text));if(i)todo.push({sev:'soft',p,d:-1,text:i.text});}});
  const gapItems=m.U.map(()=>[]);
  gaps.forEach(x=>{if(m.days[x.d].we)return;gapItems[m.G[x.g].unit].push({sev:'hard',p:-1,d:x.d,n:x.n,text:`${gName(x.g)}: ${x.n} ${x.n===1?'person':'personer'} saknas ${fmtHM(x.from)}–${fmtHM(x.to)}`});});
  m.U.forEach((u,ui)=>{const it=gapItems[ui];if(!it.length)return;
    if(it.length<=4)it.forEach(x=>todo.push(x));
    else todo.push({sev:'hard',p:-1,d:it[0].d,text:`${u.name}: bemanningen täcks inte på ${it.length} ställen på vardagar. Personalens timmar räcker inte till kurvan, eller så går passen inte ihop med vilan. Lägg till personal eller sänk kurvan under Inställningar.`});});
  // Går timmarna ihop? Jämför personalens timmar med vad kurvan kräver, per avdelning och vecka.
  const capacity={};
  m.U.forEach((u,ui)=>{let need=0;u.groups.forEach(g=>{for(let d=0;d<N;d++){const b=(d*m.nG+g)*K;for(let k=0;k<K;k++)need+=m.need[b+k]*sh.kLen[k];}});
    // personalen är på plats under rasten också, så närvaron är något större än de betalda timmarna
    const staffMin=persons.reduce((a,x,p)=>a+(m.unit[p]===ui?x.target:0),0),present=staffMin*1.06,wkH=v=>Math.round(v/60/m.WK);
    capacity[u.id]={staff:wkH(staffMin),need:wkH(need)};
    if(staffMin&&present<need*.98)todo.push({sev:'hard',p:-1,d:-1,text:`${u.name}: personalen har cirka ${wkH(staffMin)} timmar per vecka men kurvan kräver cirka ${wkH(need)}. Lägg till personal eller sänk bemanningskurvan.`});});
  persons.forEach((x,p)=>{if(!m.av[p].length)todo.push({sev:'hard',p,d:-1,text:'Inga pass passar personens begränsningar. Ändra tiderna på personens sida.'});});
  if(shortWe)todo.push({sev:'vik',p:-1,d:-1,text:`${Math.round(shortWe/60)} timmar på helger går till vikarie.`});
  const ord={hard:0,vik:1,soft:2};todo.sort((a,b)=>ord[a.sev]-ord[b.sev]||((a.d<0?999:a.d)-(b.d<0?999:b.d)));
  const cnt=f=>persons.filter(f).length;
  const sumFree=persons.reduce((a,x)=>a+x.free,0),sumBlock=persons.reduce((a,x)=>a+x.freeInBlocks,0);
  const blockPct=sumFree?sumBlock/sumFree:1;
  const hoursOk=cnt(x=>x.hoursOk),sixW=persons.reduce((a,x)=>a+x.sixWeeks,0);
  const wkN=persons.reduce((a,x)=>a+x.wkRestN,0),wkSum=persons.reduce((a,x)=>a+x.wkRestSum,0),wkMinAll=P?Math.min(...persons.map(x=>x.wkRestMin)):0;
  const maxRun=P?Math.max(...persons.map(x=>x.maxRun)):0;
  const maxRatio=P?Math.max(...persons.map(x=>x.weekRatio)):1;
  const minGapAll=P?Math.min(...persons.map(x=>x.minGap)):1e9,minWeekAll=P?Math.min(...persons.map(x=>x.minWeek)):1e9;
  const evShares=persons.filter((x,p)=>x.n&&m.shareE[p]>0).map(x=>x.ev/x.n),weN=persons.filter(x=>x.n).map(x=>x.we);
  const totN=persons.reduce((a,x)=>a+x.n,0),totAway=persons.reduce((a,x)=>a+x.away,0);
  const pill=(ok,tot)=>ok>=tot?'ok':'warn';
  const pc=(a,b)=>b?Math.round(100*(1-a/b)):100;
  const law=[
    {n:'§ 13',paper:`Dygnsvila minst ${DAILY_REST} timmar i följd`,how:'Arbetstidslagen 13 §. Kontrolleras mellan alla pass, även när grundschemat börjar om.',
     val:dailyV?`${dailyV} brister`:minGapAll<1e9?`Följs. Kortaste vila mellan två pass är ${h1(minGapAll)} h`:'Följs',st:dailyV?'bad':'ok'},
    {n:'§ 13',paper:'Vilan ska omfatta tiden 00–05',how:'Arbetstidslagen 13 §. Arbetsdagen ligger mellan 05 och 24, så inget pass ligger på natten.',val:'Följs',st:'ok'},
    {n:'§ 14',paper:`Veckovila minst ${WEEKLY_REST} timmar i följd varje vecka`,how:'Arbetstidslagen 14 §. Räknas inom varje kalendervecka, måndag till söndag.',
     val:weeklyV?`${weeklyV} brister`:minWeekAll<1e9?`Följs. Kortaste veckovila är ${Math.floor(minWeekAll/60)} h`:'Följs',st:weeklyV?'bad':'ok'},
    {n:'§ 15',paper:'Rast efter högst fem timmar',how:'Pass över fem timmar har 30 minuters rast och pass över tio timmar en timme. Rasten räknas inte som arbetstid.',val:'Följs',st:'ok'}];
  const rules=[];
  const addRule=(paper,how,val,st)=>rules.push({n:rules.length+1,paper,how,val,st});
  addRule('Bemanningskurvan täcks','Från varje tid i kurvan ska minst så många arbeta, fram till nästa tid. Personal utöver kurvan läggs helst på dagen.',
    `Vardagar ${pc(shortWd,needWd)} % av timmarna, helger ${pc(shortWe,needWe)} %`,shortWd?'bad':shortWe?'warn':'ok');
  addRule('Jämn bemanning över veckan','Personal utöver kurvan sprids jämnt över vardagarna, så att det inte är många en dag och bara det nödvändiga en annan.',
    N&&P?`Vid samma tid skiljer det högst ${daySpread} ${daySpread===1?'person':'personer'} mellan två vardagar i en grupp`:'–',daySpread<=3?'ok':'warn');
  addRule('Personalen jobbar i sin egen grupp',{aldrig:'Ingen lånas till en annan grupp. Bara du flyttar personal mellan grupper.',behov:'Motorn lånar personal till en annan grupp i avdelningen bara när bemanningen kräver det. Mellan avdelningar flyttar bara du.',
    fritt:'Motorn får lägga personal i alla grupper i avdelningen. Mellan avdelningar flyttar bara du.'}[r.lend],
    totN?`${Math.round((1-totAway/totN)*100)} % av passen i hemgruppen`:'–','ok');
  addRule('Alla arbetar varannan helg','Systemet delar varje grupp i två lika stora helglag, udda och jämna veckor, så att alla arbetar lika många helger. Arbetshelg betyder både lördag och söndag.',
    weN.length?`${Math.min(...weN)===Math.max(...weN)?`Alla har ${weN[0]}`:`${Math.min(...weN)}–${Math.max(...weN)}`} helgpass · ${cnt(x=>!x.wkMissing)} av ${P} arbetar hela sina helger`:'–',pill(cnt(x=>!x.wkMissing),P));
  addRule('Kvällarna fördelas rättvist','Varje person tar sin andel av kvällspassen, de som slutar efter 19.',
    evShares.length?`Kvällsandel ${Math.round(Math.min(...evShares)*100)}–${Math.round(Math.max(...evShares)*100)} % av passen`:'–','ok');
  const rec=[
    {n:'A',paper:'Alla får exakt sina timmar varje fyraveckorsperiod',how:`Heltid ${String(st.fullTime).replace('.',',')} h per vecka, alltså ${fmtDur(st.fullTime*60*4)} h på fyra veckor. Motorn väljer passens längd så att timmarna går jämnt ut.`,
     val:`${hoursOk} av ${P} personer`,st:pill(hoursOk,P)},
    {n:'B',paper:'Ledighet i block om minst två dagar',how:'En ensam ledig dag mellan arbetsdagar ger sällan riktig återhämtning.',
     val:`${Math.round(blockPct*100)} % av ledigheten`,st:blockPct>=.85?'ok':'warn'},
    {n:'C',paper:`Högst ${r.maxRow} arbetsdagar i rad och högst ${r.maxWeekDays} av 7 dagar`,how:'Fler än fem dagar i en vecka undviks men är tillåtet upp till gränsen. Sju dagar i rad undviks starkt.',
     val:`Längsta arbetsperiod ${maxRun} dagar · ${sixW} ${sixW===1?'vecka':'veckor'} med fler än ${r.maxWeekDays} arbetsdagar`,st:maxRun<=r.maxRow&&!sixW?'ok':'warn'},
    {n:'D',paper:'Jämna veckor',how:'Timmarna sprids över perioden, så att ingen vecka blir mycket tyngre än snittet.',
     val:`Tyngsta vecka ${Math.round(maxRatio*100)} % av snittet`,st:maxRatio<=1+W.maxWeekPct/100+.01?'ok':'warn'},
    {n:'E',paper:'Lång vila runt ledigheten',how:'Sista passet före en ledighet slutar så tidigt som möjligt och första passet efter börjar så sent som möjligt. Lediga helger prioriteras, så den som är ledig i helgen slipper helst fredagskvällen.',
     val:wkN?`Lediga helger ger i snitt ${Math.round(wkSum/wkN/60)} h vila, kortast ${Math.floor(wkMinAll/60)} h`:'Inga lediga helger',st:'ok'}];
  return {persons,flags,missG,gapH,gaps,daySpread,capacity,todo,hard,soft,shortWd,shortWe,needWd,needWe,dailyV,weeklyV,rules,rec,law,hoursOk,blockPct,maxRun,minGapAll,totAway,totN};
}
</script>

<script>
/* ================= Gränssnitt ================= */
const LS_KEY='schemaplaneraren-v8',OLD_KEYS=['schemaplaneraren-v7'];
const DOWS=['Mån','Tis','Ons','Tor','Fre','Lör','Sön'];
const LETTERS=['M','T','O','T','F','L','S'];
const PCTS=[100,95,90,85,80,75,70,65,60,55,50,45,40,35,30,25,20];
const CHEV='<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6l4 4 4-4"/></svg>';
const ICON_OK='<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>';
const ICON_BAD='<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 3.5v5.5M8 12.2v.3"/></svg>';
const ICON_WAIT='<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2.5a5.5 5.5 0 1 0 5.5 5.5"/></svg>';
const ICON_X='<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
const ICON_HOME='<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 7 8 2.5 13.5 7v6.5h-11z"/></svg>';

// welcome är 'start' första gången appen öppnas, 'guide' medan verksamheten läggs upp och tomt annars
let welcome='',guide=null,resetArm=false;
let cvG=null,cvW='weekday';   // vilken bemanningskurva som visas under Inställningar
let S=load(),A=null,busy=false,runId=0,tab='schema',mode='vecka',week=0,moved=new Set(),hist=[],todoOpen=false,statusItems=[],rulesOpen=false,popCtx=null,sheet=null,toastT=0,delArm=null;
const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(n){return String(n).split(/\s+/).filter(Boolean).map(x=>x[0]).join('').slice(0,2).toUpperCase()||'?'}
function range(v){const x=M.sh.V[v];return `${fmtShort(x.st)}–${fmtShort(x.en)}`}
// passets färg efter tid på dygnet, som CSS-variabler, så att celler, prickar och remsor färgas likadant
function tStyle(k){const c=KINDS[k].color;return `--c:${c};--on:${onColor(c)}`}
function typeName(v){return KINDS[M.sh.kind[v]].name}
function clone(o){return o==null?o:JSON.parse(JSON.stringify(o))}
function pct(x){return Math.round(x*100)+' %'}
function dLong(dy){return `${DOWL[dy.dow]}, vecka ${dy.w+1}`}
function dShort(dy){return `${DOW[dy.dow]} v${dy.w+1}`}
function gFull(g){const G=M.G[g];return `${M.U[G.unit].name} ${G.name}`}
// gruppen för en persons pass en viss dag, men bara när den inte är personens hemgrupp
function awayLabel(p,d){const g=M.grp[p*M.N+d];if(g<0||g===M.home[p])return '';return M.G[g].unit===M.unit[p]?M.G[g].name:gFull(g);}
function staffIdx(g){return M.staff.map((x,p)=>p).filter(p=>M.home[p]===g)}
function newId(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function allGroups(){const out=[];S.settings.units.forEach(u=>u.groups.forEach(g=>out.push({id:g.id,name:g.name,unit:u})));return out;}
function groupLabel(id){const g=allGroups().find(x=>x.id===id);return g?`${g.unit.name} ${g.name}`:'';}

/* ---------- lagring: bara i den här webbläsaren ----------
   Inget skickas till någon server. Säkerhetskopian är en JSON-fil som chefen sparar och öppnar själv. */
function load(){
  let o=null;
  for(const k of [LS_KEY,...OLD_KEYS]){try{const t=localStorage.getItem(k);if(t){o=JSON.parse(t);break;}}catch(e){o=null;}}
  if(!o){welcome='start';return defaults();}
  return normalize(o);
}
function persist(){S.savedAt=new Date().toISOString();store();}
function store(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){toast('Webbläsaren kunde inte spara. Spara en säkerhetskopia till fil under Inställningar.');}}
// Verksamhetens namn och färg i toppfältet, fliken och knapparna.
function tint(hex,a){const n=parseInt(hex.slice(1),16),mix=c=>Math.round(c*a+255*(1-a));return `rgb(${mix(n>>16&255)},${mix(n>>8&255)},${mix(n&255)})`;}
function applyProfile(){const st=S.settings,rs=document.documentElement.style;
  rs.setProperty('--accent',st.accent);rs.setProperty('--accent-tint',tint(st.accent,.12));
  $('#orgName').textContent=st.orgName||'Schemaplaneraren';$('#orgSub').textContent=st.orgName?'Schemaplaneraren':'Grundschema för vård och omsorg';
  document.title=st.orgName?`${st.orgName} · Schemaplaneraren`:'Schemaplaneraren';}
/* Byter hela tillståndet: efter en säkerhetskopia, demodata eller välkomstguiden. */
function loadState(ns,msg){
  runId++;setBusy(false);S=ns;hist=[];moved=new Set();closePop();closeSheet();welcome='';guide=null;tab='schema';week=0;
  if(!S.example)persist();else{S.savedAt=null;store();}
  if(S.schedule&&Object.keys(S.schedule).length)refresh();
  else{M=buildModel(S);computeAll();A=analyze();renderAll();if(S.staff.length)solveFresh(false);}
  if(msg)toast(msg);
}
function resetAll(){
  runId++;setBusy(false);try{[LS_KEY,...OLD_KEYS].forEach(k=>localStorage.removeItem(k));}catch(e){}
  S=defaults();hist=[];moved=new Set();closePop();closeSheet();welcome='start';guide=null;tab='welcome';resetArm=false;
  M=buildModel(S);computeAll();A=analyze();renderAll();window.scrollTo({top:0});
}
function backupName(){const o=(S.settings.orgName||'Schemaplaneraren').replace(/[\\/:*?"<>|]+/g,'').trim()||'Schemaplaneraren';return `${o} säkerhetskopia ${new Date().toISOString().slice(0,10)}.json`;}
function saveBackup(){saveFile(backupName(),new Blob([JSON.stringify({app:'schemaplaneraren',savedAt:new Date().toISOString(),state:S})],{type:'application/json'}),'Säkerhetskopian laddas ner. Spara den på ett säkert ställe.');}
function openBackup(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;
    try{const o=JSON.parse(await f.text()),st=o&&o.state?o.state:o;if(!st||typeof st!=='object'||!st.settings||!Array.isArray(st.staff))throw new Error('format');
      loadState(normalize(st),'Säkerhetskopian är öppnad');}
    catch(e){toast('Filen kunde inte läsas. Välj en säkerhetskopia från Schemaplaneraren.');}};
  inp.click();}

/* ---------- körning ---------- */
function refresh(){M=buildModel(S);warmStart(S.schedule);computeAll();S.schedule=extract();A=analyze();renderAll();}
function snapshot(){hist.push(JSON.stringify({locks:S.locks,schedule:S.schedule,staff:S.staff,settings:S.settings,stale:S.stale,example:S.example}));if(hist.length>30)hist.shift();}
function undo(){if(busy||!hist.length)return;Object.assign(S,JSON.parse(hist.pop()));S=normalize(S);moved=new Set();closePop();persist();refresh();toast('Ångrat');}
const yieldNow=()=>document.hidden?new Promise(r=>{const c=new MessageChannel();c.port1.onmessage=()=>r();c.port2.postMessage(0);}):new Promise(r=>setTimeout(r,0));
/* Kör optimeringen i små steg så att sidan inte fryser. Avbryts om den tar för lång tid. */
async function anneal(iters,T0,T1,budgetMs,id){
  const t0=performance.now();let i=0;
  while(i<iters){const el=performance.now()-t0;if(el>budgetMs)break;
    const frac=Math.max(i/iters,el/budgetMs),T=Math.max(.01,T0*Math.pow(T1/T0,Math.min(1,frac)));
    const end=Math.min(iters,i+15000);for(;i<end;i++)trySwap(T);
    setProgress(frac);
    await yieldNow();if(id!==runId)return false;}
  return true;
}
// Medan motorn söker visar statusrutan vad som händer och hur långt den kommit, och schemat tonas ner.
let busyKind='';
function setBusy(b,kind){busy=b;busyKind=b?(kind||'fresh'):'';const nb=$('#btnNew');if(nb)nb.disabled=b;$('#progress').hidden=!b;if(b)$('#pbar').style.width='0%';
  $('#tab-schema').classList.toggle('busy',b);if(b){renderStatus();setProgress(0);}}
function setProgress(f){const pc=(Math.min(1,f)*100).toFixed(0)+'%';$('#pbar').style.width=pc;
  const sb=$('#sbar'),sp=$('#spct');if(sb)sb.style.width=pc;if(sp)sp.textContent=pc.replace('%',' %');}

async function solveFresh(record){
  if(busy)return;if(record)snapshot();const id=++runId;setBusy(true,'fresh');
  try{
    RNG=mulberry32((Math.random()*1e9)|0);
    M=buildModel(S);computeAll();greedyFill();
    // Ett nytt grundschema läggs sällan, så sökningen får gå längre. Testerna visar att fem gånger längre sökning ger
    // tydligt bättre schema (färre vikariepass, längre vila runt lediga helger, fler i hemgruppen).
    if(!await anneal(S.settings.iterations*5,60,.3,30000,id))return;
    strictLaw();greedyFill();for(let i=0;i<40000;i++)trySwap(.05);finish();
    S.schedule=extract();S.stale=false;A=analyze();moved=new Set();
    if(record||!S.example)persist();else store();
  }catch(e){console.error(e);toast('Något gick fel när schemat lades. Försök igen.');}
  finally{if(id===runId){setBusy(false);if(!A&&M){A=analyze();}renderAll();}}
  if(id===runId&&record)toast('Schemat är omlagt',true);
}
/* Anpassar schemat efter en ändring: låsta rutor står kvar, resten justeras så att alla
   fortfarande får sina timmar och så få andra pass som möjligt flyttas. */
async function adjust(prev,skipKey,msg){
  if(busy)return;const id=++runId;setBusy(true,'adjust');
  try{
    RNG=mulberry32((Math.random()*1e9)|0);
    M=buildModel(S);warmStart(S.schedule);M.base=baseFrom(prev);computeAll();greedyFill();
    if(!await anneal(250000,4,.1,2500,id))return;
    strictLaw();greedyFill();for(let i=0;i<20000;i++)trySwap(.03);finish();M.base=null;computeAll();
    S.schedule=extract();A=analyze();
    moved=new Set();M.staff.forEach((x,p)=>{for(let d=0;d<M.N;d++){const a=(prev&&prev[x.id]||{})[d]||'',b=(S.schedule[x.id]||{})[d]||'';if(a!==b)moved.add(p*M.N+d);}});
    if(skipKey)skipKey.forEach(k=>moved.delete(k));
    persist();
  }catch(e){console.error(e);toast('Något gick fel. Ändringen är sparad, men schemat kunde inte anpassas.');}
  finally{if(id===runId){setBusy(false);renderAll();}}
  if(id!==runId)return;
  const n=moved.size;
  toast(msg+(n?` · ${n} ${n===1?'annan ruta':'andra rutor'} justerades`:''),true);
}
function change(fn,msg){if(busy)return;snapshot();const prev=clone(S.schedule);const skip=fn()||null;S.example=false;return adjust(prev,skip,msg);}
/* Ändringar i personal och inställningar sparas direkt men lägger inte om schemat förrän chefen vill. */
function edit(fn,opts){if(busy)return false;snapshot();const r=fn();if(r===false){hist.pop();return false;}S.example=false;S=normalize(S);if(!opts||opts.stale!==false)S.stale=true;persist();refresh();return true;}
function updateSchedule(){if(busy)return;snapshot();const prev=clone(S.schedule);S.stale=false;adjust(prev,null,'Schemat är uppdaterat');}

/* ---------- en dag: hur den är bemannad ----------
   Visar för en grupp, eller för alla avdelningar och grupper, vem som jobbar vilket pass, vem som är
   lånad in eller ut, vilka pass som är tomma och vilka i gruppen som är lediga och kan hoppa in. */
function openDay(d,g,keep){
  const m=M,dy=m.days[d],scroll=keep?$('#sheet').scrollTop:0,all=g<0,prevG=sheet&&sheet.kind==='day'?sheet.lastG:undefined;sheet={kind:'day',d,g};

    const segs=[];for(let k=0;k<m.K;k++)segs.push({a:m.sh.TP[k],b:m.sh.TP[k+1],need:m.need[b+k],have:m.cnt[b+k]});
    const ws=[];for(let q=0;q<m.P;q++)if(m.row[q][d]>=0&&m.grp[q*m.N+d]===gi)ws.push(q);
    ws.sort((x,y)=>m.sh.st[m.row[x][d]]-m.sh.st[m.row[y][d]]||m.sh.en[m.row[x][d]]-m.sh.en[m.row[y][d]]);
    const items=ws.map(q=>{const v=m.row[q][d],from=m.home[q]!==gi?`<span class="awaytag">från ${esc(m.G[m.home[q]].unit===G.unit?m.G[m.home[q]].name:gFull(m.home[q]))}</span>`:'';
      return `<li><i class="dot kc" style="${tStyle(m.sh.kind[v])}"></i><button class="dname" data-p="${q}">${esc(m.staff[q].name)}</button>${from}<span class="dtime">${range(v)}</span></li>`;}).join('');
    const gaps=A.gaps.filter(x=>x.d===d&&x.g===gi).map(x=>`<span class="tag ${vik?'warn':'bad'}">${x.n} saknas ${fmtShort(x.from)}–${fmtShort(x.to)}</span>`).join('');
    const home=staffIdx(gi),out=home.filter(q=>{const gg=m.grp[q*m.N+d];return gg>=0&&gg!==gi;});
    const free=home.filter(q=>m.row[q][d]<0);
    const freeTxt=free.map(q=>{const notes=[];if(dy.we&&!m.wkWork[q*m.WK+dy.w])notes.push('ledig helg');
      return `<button class="dname" data-p="${q}">${esc(m.staff[q].name)}</button>${notes.length?`<span class="muted small"> (${notes.join(', ')})</span>`:''}`;}).join(', ');
    return `<div class="dgroup"><div class="dgh"><h3>${esc(m.U[G.unit].name)} ${esc(G.name)}</h3><span class="${gapH?(vik?'warnt':'badt'):'okt'}">${gapH?`${fmtDur(gapH*60)} h under kurvan${vik?', till vikarie':''}`:`${ws.length} i tjänst, kurvan täcks`}</span></div>
      ${covChart(segs,d0,d1,`Bemanning ${G.name}`)}
      <p class="small muted">Linjen är bemanningskurvan, staplarna hur många som arbetar.</p>
      ${gaps?`<div class="dgaps">${gaps}</div>`:''}
      ${items?`<ul class="dlist">${items}</ul>`:'<p class="small muted">Ingen arbetar här den här dagen.</p>'}
      ${out.length?`<p class="small"><b>Utlånade:</b> ${out.map(q=>`<button class="dname" data-p="${q}">${esc(m.staff[q].name)}</button> till ${esc(gFull(m.grp[q*m.N+d]))}`).join(', ')}</p>`:''}
      <p class="small"><b>Lediga i ${esc(G.name)}:</b> ${freeTxt||'<span class="muted">ingen</span>'}</p></div>`;};
  const scopeG=g>=0?g:(prevG??0);
  showSheet(`<div class="shtop"><div class="dnav"><button class="btn ghost icon" data-dstep="-1" aria-label="Föregående dag"${d<=0?' disabled':''}>‹</button><h2>${DOWL[dy.dow]} <span class="muted">vecka ${dy.w+1}</span></h2><button class="btn ghost icon" data-dstep="1" aria-label="Nästa dag"${d>=m.N-1?' disabled':''}>›</button></div><button class="btn ghost" id="shClose">Stäng</button></div>
    <nav class="subnav" aria-label="Visa"><button data-dscope="${scopeG}"${all?'':' aria-current="true"'}>${esc(gFull(scopeG))}</button><button data-dscope="-1"${all?' aria-current="true"':''}>Alla avdelningar och grupper</button></nav>
    ${all?m.G.map((G,gi)=>groupHtml(gi)).join(''):groupHtml(g)}
    <p class="small muted">Klicka på ett namn för att se personen. Pass ändras genom att klicka på dem i schemat.</p>`);
  sheet.lastG=scopeG;
  $('#sheet').scrollTop=scroll;
}
/* Bemanningen som diagram. segs är intervall {a,b,need,have}: kurvan ritas som en trappa och, när have finns,
   hur många som arbetar som staplar, röda där kurvan inte täcks. Utan have fylls ytan under kurvan och talen skrivs ut. */
function covChart(segs,d0,d1,label){
  if(!segs.length||d1<=d0)return '';
  const W=420,H=150,pl=22,pr=8,pt=18,pb=20,has=segs.some(s=>s.have!=null),mx=Math.max(2,...segs.map(s=>Math.max(s.need,s.have||0)));
  const x=t=>(pl+(t-d0)/(d1-d0)*(W-pl-pr)).toFixed(1),y=n=>(pt+(1-n/mx)*(H-pt-pb)).toFixed(1);
  let g='';
  const step=mx>12?4:mx>6?2:1;
  for(let n=0;n<=mx;n+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(n)}" y2="${y(n)}" class="cg"/><text x="${pl-6}" y="${(+y(n)+3.5).toFixed(1)}" class="cy">${n}</text>`;
  for(let t=Math.ceil(d0/120)*120;t<=d1;t+=120)g+=`<text x="${x(t)}" y="${H-6}" class="cx">${fmtShort(t)}</text>`;
  if(has)segs.forEach(s=>{if(!s.have)return;g+=`<rect x="${(+x(s.a)+.5).toFixed(1)}" y="${y(s.have)}" width="${Math.max(0,x(s.b)-x(s.a)-1).toFixed(1)}" height="${(y(0)-y(s.have)).toFixed(1)}" class="cb${s.have<s.need?' bad':''}"/>`;});
  let path='';segs.forEach((s,i)=>{path+=`${i?'L':'M'}${x(s.a)} ${y(s.need)}L${x(s.b)} ${y(s.need)}`;});
  if(!has)g+=`<path d="${path}L${x(segs[segs.length-1].b)} ${y(0)}L${x(segs[0].a)} ${y(0)}Z" class="ca"/>`;
  g+=`<path d="${path}" class="cl"/>`;
  if(!has)segs.forEach((s,i)=>{if(i&&segs[i-1].need===s.need)return;let e=i;while(e+1<segs.length&&segs[e+1].need===s.need)e++;
    const mid=(+x(s.a)+ +x(segs[e].b))/2;if(x(segs[e].b)-x(s.a)>16)g+=`<text x="${mid.toFixed(1)}" y="${(+y(s.need)-5).toFixed(1)}" class="cn">${s.need}</text>`;});
  return `<svg class="cchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label||'Bemanningskurva')}">${g}</svg>`;
}
// Kurvans punkter som intervall från arbetsdagens start till slut.
function curveSegs(pts,d0,d1){const segs=[];const ms=pts.map(([t,n])=>[hm(t),n]);
  if(!ms.length||ms[0][0]>d0)segs.push({a:d0,b:ms.length?ms[0][0]:d1,need:0});
  ms.forEach(([t,n],i)=>segs.push({a:t,b:i+1<ms.length?ms[i+1][0]:d1,need:n}));return segs;}
function curveHas(gid){const c=S.settings.curves[gid];return !!c&&['weekday','weekend'].some(w=>c[w].some(x=>x[1]>0));}

/* ---------- personal ---------- */
/* Tolkar rader som klistrats in från Excel: namn, tjänstgöringsgrad och grupp i valfri ordning.
   groups är en lista med {id,name,unit:{name}}. En kolumn med ett gruppnamn väljer gruppen för raden. */
function parsePaste(text,groups){
  groups=groups||allGroups();
  const rows=[];
  String(text||'').split(/\r?\n/).forEach((line,li)=>{
    if(!line.trim())return;
    let cols=line.split('\t');if(cols.length===1&&line.includes(';'))cols=line.split(';');
    cols=cols.map(c=>c.trim()).filter(Boolean);if(!cols.length)return;
    if(li===0&&cols.some(c=>/^(namn|name|förnamn|efternamn|personal)$/i.test(c)))return;
    let p=null,gid=null;const nameParts=[];
    cols.forEach(c=>{const low=c.toLowerCase();
      if(low==='heltid'){if(p===null)p=100;return;}
      if(/^[\d\s.,% ]+$/.test(c)){let v=num(c,NaN);if(isFinite(v)){if(v>0&&v<=1&&!c.includes('%'))v*=100;if(v>=5&&v<=100&&p===null){p=Math.round(v);return;}}return;}
      // avdelnings- och gruppnamn i en egen kolumn hör inte till namnet
      const gm=groups.find(g=>g.name.toLowerCase()===low);if(gm){gid=gm.id;return;}
      if(groups.some(g=>g.unit.name.toLowerCase()===low))return;
      nameParts.push(c);});
    const name=nameParts.join(' ').replace(/\s+/g,' ').trim().slice(0,60);if(!name)return;
    rows.push({name,pct:p===null?100:p,gid,note:p===null?'Tjänstgöringsgrad saknas, blir 100 %':''});});
  return rows;
}

// Ny person hamnar i det helglag i gruppen som har minst personal.
function newPerson(gid,name,pct){
  const n=[0,1].map(k=>S.staff.filter(x=>x.group===gid&&wgIndex(x)===k).length);
  return {id:newId(),name,group:gid,pct,wg:WG[n[0]<=n[1]?0:1],earliest:null,latest:null,maxLen:null};}
function applyPaste(replace){
  const gid=sheet.gid,rows=sheet.rows||[];if(!rows.length)return;
  edit(()=>{
    if(replace){const gone=S.staff.filter(x=>x.group===gid).map(x=>x.id);gone.forEach(id=>{delete S.locks[id];if(S.schedule)delete S.schedule[id];});S.staff=S.staff.filter(x=>x.group!==gid);}
    rows.forEach(r=>S.staff.push(newPerson(gid,r.name,r.pct)));
  });
  closeSheet();toast(`${rows.length} personer ${replace?'inlagda':'tillagda'} i ${groupLabel(gid)}`);

    .map(u=>u.groups.length?u:Object.assign(u,{groups:[{id:'g'+(++gn),name:'Grupp 1'}]})).slice(0,8);}
function guideStaffInfo(){const units=guideUnits(),groups=units.flatMap(u=>u.groups.map(g=>({id:g.id,name:g.name,unit:u})));

  const per=groups.map(g=>`${g.name} ${rows.filter(r=>(r.gid||groups[0].id)===g.id).length}`).join(', ');

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=true;
  const t=setTimeout(()=>rej(new Error('timeout')),15000);s.onload=()=>{clearTimeout(t);res();};s.onerror=()=>{clearTimeout(t);rej(new Error('load'));};document.head.appendChild(s);});}
function cellText(p,d){const v=M.row[p][d];if(v<0)return '';const g=awayLabel(p,d);return `${fmtHM(M.sh.V[v].st)}–${fmtHM(M.sh.V[v].en)}${g?' i '+g:''}`;}
const hNum=min=>Math.round(min/60*100)/100;
function buildWorkbook(X){
  const m=M,wb=X.utils.book_new();
  for(let w=0;w<m.WK;w++){
    const aoa=[[`${orgTitle()} · grundschema vecka ${w+1} av ${m.WK}`],[],['Namn','Grupp','Tjänstgöring',...DOWL,'Timmar']];
    m.G.forEach((G,g)=>{const ps=staffIdx(g);if(!ps.length)return;
      ps.forEach(p=>{const x=m.staff[p],row=[x.name,gFull(g),x.pct/100];for(let d=w*7;d<w*7+7;d++)row.push(cellText(p,d));row.push(hNum(A.persons[p].weeks[w]||0));aoa.push(row);});
      aoa.push([]);});
    const ws=X.utils.aoa_to_sheet(aoa);
    for(let r=3;r<aoa.length;r++){const c=ws[X.utils.encode_cell({r,c:2})];if(c&&typeof c.v==='number')c.z='0%';}
    ws['!cols']=[{wch:24},{wch:16},{wch:12},...Array(7).fill({wch:15}),{wch:9}];
    X.utils.book_append_sheet(wb,ws,`Vecka ${w+1}`);}
  const sum=[['Summering för hela perioden'],[],['Namn','Grupp','Tjänstgöring','Timmar','Ska ha','Pass','Kvällar','Helgpass','Lediga dagar','Pass i annan grupp','Ledighet i block']];
  m.G.forEach((G,g)=>staffIdx(g).forEach(p=>{const x=m.staff[p],s=A.persons[p];sum.push([x.name,gFull(g),x.pct/100,hNum(s.mins),hNum(s.target),s.n,s.ev,s.we,s.free,s.away,Math.round(s.blockPct*100)/100]);}));
  const ws2=X.utils.aoa_to_sheet(sum);
  for(let r=3;r<sum.length;r++){[2,10].forEach(c=>{const cl=ws2[X.utils.encode_cell({r,c})];if(cl&&typeof cl.v==='number')cl.z='0%';});}
  ws2['!cols']=[{wch:24},{wch:16},{wch:12},{wch:9},{wch:9},{wch:7},{wch:8},{wch:9},{wch:12},{wch:16},{wch:15}];
  X.utils.book_append_sheet(wb,ws2,'Summering');
  const rr=[['Regler och lag'],[],['Krav','Resultat']];A.law.concat(A.rules,A.rec).forEach(r=>rr.push([r.paper,r.val]));
  const ws3=X.utils.aoa_to_sheet(rr);ws3['!cols']=[{wch:60},{wch:60}];X.utils.book_append_sheet(wb,ws3,'Regler');
  return wb;
}
function buildCSV(){
  const q=v=>{const s=String(v??'');return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const lines=[['Namn','Grupp','Tjänstgöring',...M.days.map(dy=>`V${dy.w+1} ${DOW[dy.dow]}`),'Timmar'].map(q).join(';')];
  M.G.forEach((G,g)=>staffIdx(g).forEach(p=>{const x=M.staff[p];const r=[x.name,gFull(g),x.pct+' %'];for(let d=0;d<M.N;d++)r.push(cellText(p,d));r.push(String(hNum(A.persons[p].mins)).replace('.',','));lines.push(r.map(q).join(';'));}));
  return lines.join('\r\n');
}
function saveFile(filename,data,msg){
  const blob=data instanceof Blob?data:new Blob([data]);
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);
  toast(msg||'Filen laddas ner. Öppna den i Excel för att skriva ut.');
}
const orgTitle=()=>S.settings.orgName||'Schemaplaneraren';
const fileSafe=t=>t.replace(/[\\/:*?"<>|]+/g,'').trim()||'Schemaplaneraren';
async function exportExcel(){
  if(busy||!M||!M.P){toast('Lägg in personal och skapa ett schema först.');return;}
  const btn=$('#btnExcel');btn.disabled=true;
  try{
    let X=window.XLSX;
    // Excelbiblioteket ligger i lib/ bredvid sidan och laddas först när det behövs. Utan det blir det en CSV-fil.
    if(!X){try{await loadScript('lib/xlsx.full.min.js');X=window.XLSX;}catch(e){X=null;}}
    const fn=`${fileSafe(orgTitle())} grundschema ${M.WK} veckor`;
    if(X){const out=X.write(buildWorkbook(X),{type:'array',bookType:'xlsx'});
      saveFile(fn+'.xlsx',new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));}
    else saveFile(fn+'.csv',new Blob(['﻿'+buildCSV()],{type:'text/csv;charset=utf-8'}));
  }catch(e){console.error(e);toast('Filen kunde inte skapas. Försök igen.');}
  btn.disabled=false;
}
