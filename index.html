    edit(()=>{u.groups.forEach(g=>{if(g.id!==cvG)st.curves[g.id][cvW]=clone(st.curves[cvG][cvW]);});});toast(`Kurvan gäller nu alla grupper i ${u.name}`,true);return;}
  if(t.closest('#uadd')){const ids=allIds(),uid=nextId('u',ids),gid=nextId('g',ids);
    edit(()=>{st.units.push({id:uid,name:'Ny avdelning',groups:[{id:gid,name:'Grupp 1'}]});st.curves[gid]=clone(DEFAULT_CURVE);});return;}
  const gadd=t.closest('[data-gadd]');if(gadd){const u=st.units[+gadd.dataset.gadd],gid=nextId('g',allIds());
    edit(()=>{u.groups.push({id:gid,name:'Grupp '+(u.groups.length+1)});st.curves[gid]=clone(st.curves[u.groups[0].id]||DEFAULT_CURVE);});return;}
  const urm=t.closest('[data-unrm]');if(urm){const u=st.units[+urm.dataset.unrm],ids=u.groups.map(g=>g.id);
    if(S.staff.some(x=>ids.includes(x.group))){toast(`Flytta eller ta bort personalen i ${u.name} först.`);return;}
    edit(()=>{st.units.splice(+urm.dataset.unrm,1);ids.forEach(g=>delete st.curves[g]);dropCodes(ids);});
    toast(`${u.name} är borttagen`,true);return;}
  const grm=t.closest('[data-grm]');if(grm){const [ui,gi]=grm.dataset.grm.split('.').map(Number),u=st.units[ui],g=u.groups[gi],to=u.groups.find(x=>x.id!==g.id);
    const n=S.staff.filter(x=>x.group===g.id).length;
    edit(()=>{S.staff.forEach(x=>{if(x.group===g.id)x.group=to.id;});u.groups.splice(gi,1);delete st.curves[g.id];dropCodes([g.id]);});
    toast(`${g.name} är borttagen${n?`. ${n} personer flyttades till ${to.name}`:''}`,true);return;}
});
$('#tab-regler').addEventListener('change',e=>{
  const el=e.target,st=S.settings;
  if(el.id==='st-fullTime'){const v=num(el.value,NaN);if(!isFinite(v)||v<20||v>45){toast('Heltid ska vara mellan 20 och 45 timmar per vecka.');el.value=String(st.fullTime).replace('.',',');return;}
    edit(()=>{st.fullTime=Math.round(v*4)/4;});return;}
  if(el.id==='st-org'){const v=el.value.replace(/\s+/g,' ').trim().slice(0,60);if(v===st.orgName)return;edit(()=>{st.orgName=v;},{stale:false});return;}
  if(el.id==='st-d0'||el.id==='st-d1'){const k=el.id==='st-d0'?'start':'end',tm=parseTime(el.value);
    const nx=Object.assign({},st.day,{[k]:tm});
    if(!tm||(k==='start'&&tm==='24:00')){toast('Skriv tiden som till exempel 06:45.');el.value=st.day[k];return;}
    if(hm(nx.start)<300){toast('Arbetsdagen kan börja tidigast 05:00. Nattpass finns inte.');el.value=st.day[k];return;}
    if(hm(nx.end)-hm(nx.start)<180){toast('Arbetsdagen måste vara minst tre timmar.');el.value=st.day[k];return;}
    edit(()=>{st.day[k]=tm;});return;}
  if(el.id==='st-smin'||el.id==='st-smax'){const k=el.id==='st-smin'?'min':'max',v=num(el.value,NaN);
    if(!isFinite(v)||v<2||v>12){toast('Skriv antal timmar mellan 2 och 12, till exempel 9,5.');el.value=fmtH(st.shift[k]/60);return;}
    const mins=Math.round(v*4)*15;if(k==='min'&&mins>st.shift.max||k==='max'&&mins<st.shift.min){toast('Kortaste pass kan inte vara längre än längsta pass.');el.value=fmtH(st.shift[k]/60);return;}
    edit(()=>{st.shift[k]=mins;});return;}
  if(el.dataset.cvt!==undefined){const i=+el.dataset.cvt,pts=st.curves[cvG][cvW],tm=parseTime(el.value),m0=tm?hm(tm):NaN;
    if(!tm||m0<hm(st.day.start)||m0>=hm(st.day.end)){toast(`Skriv en tid mellan ${st.day.start} och ${st.day.end}.`);el.value=pts[i][0];return;}
    if(pts.some((x,j)=>j!==i&&hm(x[0])===m0)){toast(`${tm} finns redan i kurvan.`);el.value=pts[i][0];return;}
    edit(()=>{pts[i][0]=tm;});return;}
  if(el.dataset.cvn!==undefined){const i=+el.dataset.cvn,pts=st.curves[cvG][cvW],v=Math.round(num(el.value,NaN));
    if(!isFinite(v)||v<0||v>30){toast('Skriv ett antal mellan 0 och 30.');el.value=pts[i][1];return;}
    edit(()=>{pts[i][1]=v;});return;}
  if(el.dataset.rule){const k=el.dataset.rule,[lo,hi,step]=RULE_LIMITS[k],raw=num(el.value,NaN),v=Math.round(raw/step)*step;
    if(!isFinite(raw)||v<lo||v>hi){toast(`Skriv ett tal mellan ${fmtH(lo)} och ${fmtH(hi)}.`);el.value=fmtH(st.rules[k]);return;}
    edit(()=>{st.rules[k]=v;});return;}
  if(el.dataset.un!==undefined){const u=st.units[+el.dataset.un],v=el.value.replace(/\s+/g,' ').trim().slice(0,30);if(!v){el.value=u.name;return;}
    edit(()=>{u.name=v;},{stale:false});return;}
  if(el.dataset.gn){const [ui,gi]=el.dataset.gn.split('.').map(Number),g=st.units[ui].groups[gi],v=el.value.replace(/\s+/g,' ').trim().slice(0,20);if(!v){el.value=g.name;return;}
    edit(()=>{g.name=v;},{stale:false});return;}
});
$('#tab-welcome').addEventListener('click',e=>{const t=e.target;
  if(t.closest('#wDemo')){loadState(defaults());return;}
  if(t.closest('#wGuide')){openGuide();return;}
  if(t.closest('#wOpen')){openBackup();return;}
  if(t.closest('#gCancel')){guide=null;if(S.savedAt||S.schedule){welcome='';setTab('schema');}else{welcome='start';renderAll();}return;}
  if(t.closest('#guAdd')){guide.units.push({name:'Avdelning '+(guide.units.length+1),groups:'Grupp 1'});renderWelcome();return;}
  const rm=t.closest('[data-gurm]');if(rm){guide.units.splice(+rm.dataset.gurm,1);renderWelcome();return;}
  if(t.closest('#gCreate'))createFromGuide();});
$('#tab-welcome').addEventListener('input',e=>{const el=e.target;if(!guide)return;
  if(el.id==='gName')guide.name=el.value;
  if(el.dataset.gu!==undefined)guide.units[+el.dataset.gu][el.dataset.f]=el.value;
  if(el.id==='gStaff')guide.staff=el.value;
  if(el.id==='gStaff'||el.dataset.f==='groups'){const i=$('#gStaffInfo');if(i)i.textContent=guideStaffInfo();}});
$('#scrim').onclick=closeSheet;
document.addEventListener('click',e=>{if(!$('#pop').hidden&&!e.target.closest('#pop'))closePop();
  if(resetArm&&!e.target.closest('#rsAll')){resetArm=false;if(tab==='regler')renderRegler();}
  if(delArm&&!e.target.closest('[data-del]')){delArm=null;const p=sheet&&sheet.kind==='person'?M.staff.findIndex(x=>x.id===sheet.id):-1;if(p>=0)openPerson(p,true);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#pop').hidden)closePop();else closeSheet();}
  if((e.metaKey||e.ctrlKey)&&e.key==='z'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();undo();}});
window.addEventListener('resize',closePop);

/* ---------- start ---------- */
(function start(){
  try{
    if(welcome){tab='welcome';M=buildModel(S);computeAll();A=analyze();renderAll();return;}
    if(S.schedule&&Object.keys(S.schedule).length){refresh();}
    else{M=buildModel(S);computeAll();A=analyze();busy=true;renderAll();busy=false;if(S.staff.length)solveFresh(false);else renderAll();}
  }catch(e){console.error(e);S=defaults();M=buildModel(S);computeAll();A=analyze();renderAll();solveFresh(false);}
})();
</script>
